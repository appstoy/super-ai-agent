[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "super-ai-agent"
version = "0.1.0.dev0"
description = "An event-driven, persistent Super-agent platform."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Super AI Agent contributors" }]
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.7,<1",
  "mypy>=1.13,<2",
]

[project.scripts]
super-agent = "super_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/super_agent"]

[tool.hatch.build]
# The console pages are plain HTML served by the API, not Python modules.
# Declaring them explicitly keeps `/` and `/ops` working from an installed
# wheel instead of silently falling back to the embedded page.
artifacts = ["src/super_agent/web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["super_agent"]

