name: quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.x"
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --extra dev --python 3.12
      - name: Run tests
        run: uv run pytest
      - name: Check lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy src

