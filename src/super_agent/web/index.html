<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Super Agent</title>
<style>
:root{
  --bg:#fbfbfd; --panel:#fff; --ink:#1d1d1f; --ink2:#6e6e73; --ink3:#a1a1a6;
  --line:#e6e6ea; --line2:#f0f0f3;
  --accent:#0071e3; --accent-soft:#eaf3ff;
  --c-red:#e5484d; --c-orange:#f76b15; --c-yellow:#f5d90a; --c-green:#30a46c;
  --c-blue:#0090ff; --c-purple:#8e4ec6; --c-gray:#8b8b90;
  --ok:#1f9d55; --ok-soft:#eaf7ef;
  --err:#d70015; --err-soft:#fdecee;
  --wait:#95711c; --wait-soft:#fdf6e3;
  --shadow:0 1px 2px rgba(0,0,0,.04), 0 8px 28px rgba(0,0,0,.06);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:18px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0b0b0d; --panel:#151517; --ink:#f5f5f7; --ink2:#98989d; --ink3:#6e6e73;
    --line:#26262a; --line2:#1e1e21;
    --accent:#0a84ff; --accent-soft:#0d2438;
    --ok:#30d158; --ok-soft:#10261a;
    --err:#ff453a; --err-soft:#2c1416;
    --wait:#ffd60a; --wait-soft:#2a2312;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 34px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:15px; line-height:1.6; min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--accent-soft)}
button,input,select,textarea{font:inherit;color:inherit}

.wrap{max-width:720px;margin:0 auto;padding:0 22px 120px}

/* ---------- top ---------- */
.top{
  display:flex;align-items:center;gap:12px;
  padding:22px 0 0;
}
.top .mark{
  width:26px;height:26px;border-radius:9px;flex:none;
  background:linear-gradient(140deg,#0071e3,#5e5ce6);
  box-shadow:0 2px 8px rgba(0,113,227,.28);
}
.top .name{font-weight:600;letter-spacing:-.01em}
.top .spacer{flex:1}
.top select{
  border:1px solid var(--line);background:var(--panel);border-radius:99px;
  padding:6px 30px 6px 13px;font-size:12.5px;color:var(--ink2);
  appearance:none;cursor:pointer;max-width:190px;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);
  background-position:calc(100% - 15px) 51%,calc(100% - 11px) 51%;
  background-size:4px 4px,4px 4px;background-repeat:no-repeat;
}
.top select:focus{outline:none;border-color:var(--accent)}
.quiet{
  color:var(--ink3);text-decoration:none;font-size:12.5px;padding:6px 4px;border-radius:8px;
}
.quiet:hover{color:var(--ink2)}

.notify{
  border:1px solid var(--line);background:var(--panel);color:var(--ink3);
  border-radius:99px;padding:6px 12px;font-size:12.5px;cursor:pointer;
  transition:.15s;white-space:nowrap;
}
.notify:hover{border-color:var(--accent);color:var(--accent)}
.notify.on{color:var(--accent);border-color:transparent;background:var(--accent-soft)}

/* a result opened from a notification should be findable at a glance */
.card.flash{animation:flash 1.6s ease-out}
@keyframes flash{
  0%{box-shadow:0 0 0 3px var(--accent)}
  100%{box-shadow:0 1px 2px rgba(0,0,0,.03)}
}

/* ---------- hero ---------- */
.hero{padding:64px 0 30px;text-align:center}
.hero h1{
  font-size:clamp(30px,5.4vw,44px);line-height:1.14;letter-spacing:-.028em;
  font-weight:650;
}
.hero .sub{color:var(--ink2);margin-top:12px;font-size:15.5px}

.composer{
  margin-top:30px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:var(--shadow);
  display:flex;align-items:flex-end;gap:10px;padding:12px 12px 12px 18px;
  transition:border-color .18s, box-shadow .18s;
}
.composer:focus-within{
  border-color:#bcd9f7;box-shadow:0 1px 2px rgba(0,0,0,.04), 0 10px 34px rgba(0,113,227,.12);
}
@media (prefers-color-scheme: dark){
  .composer:focus-within{border-color:#1d4a75;box-shadow:0 12px 34px rgba(0,0,0,.5)}
}
.composer textarea{
  flex:1;border:0;background:none;resize:none;outline:none;
  padding:8px 0;max-height:190px;line-height:1.55;font-size:15.5px;
}
.composer textarea::placeholder{color:var(--ink3)}
.send{
  border:0;border-radius:12px;background:var(--accent);color:#fff;
  padding:9px 18px;font-weight:550;font-size:14px;cursor:pointer;flex:none;
  transition:opacity .15s,transform .12s;
}
.send:hover{opacity:.9}
.send:active{transform:scale(.97)}
.send:disabled{opacity:.4;cursor:default;transform:none}
.send .spin{
  display:none;width:13px;height:13px;border-radius:50%;
  border:2px solid rgba(255,255,255,.4);border-top-color:#fff;
  animation:spin .7s linear infinite;vertical-align:-2px;margin-right:7px;
}
.send.busy .spin{display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

.composer-wrap{position:relative}
/* Slash menu: typing "/" in the composer opens the skill list in place, so
   picking a skill does not require reaching for a separate row of chips. */
.slash-menu{
  position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:40;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 12px 34px rgba(0,0,0,.14);padding:6px;max-height:290px;
  overflow-y:auto;text-align:left;
}
@media (prefers-color-scheme: dark){
  .slash-menu{box-shadow:0 14px 40px rgba(0,0,0,.6)}
}
.slash-menu[hidden]{display:none}
.slash-item{
  display:flex;align-items:center;gap:10px;width:100%;box-sizing:border-box;
  border:0;background:none;color:var(--ink);text-align:left;cursor:pointer;
  padding:9px 11px;border-radius:9px;font-size:13.5px;line-height:1.35;
}
.slash-item .nm{font-weight:600;flex:none}
.slash-item .ds{
  color:var(--ink3);font-size:12px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;flex:1;
}
.slash-item .on{font-size:11px;color:var(--accent);font-weight:600;flex:none}
.slash-item.sel,.slash-item:hover{background:var(--accent-soft)}
.slash-item.sel .nm{color:var(--accent)}
.slash-empty{padding:12px 14px;color:var(--ink3);font-size:13px}
.slash-foot{
  padding:7px 12px 3px;color:var(--ink3);font-size:11.5px;
  border-top:1px solid var(--line2);margin-top:5px;
}
.slash-sec{
  padding:9px 12px 4px;color:var(--ink3);font-size:11.5px;
  display:flex;align-items:center;gap:7px;
}
.slash-sec .n{flex:1}
.slash-sec button{
  border:1px solid var(--line);background:var(--panel);color:var(--ink2);
  border-radius:99px;padding:3px 9px;font-size:11px;cursor:pointer;
}
.slash-sec button:hover{border-color:var(--accent);color:var(--accent)}
.market-item{opacity:.96}
.market-item .nm{color:var(--ink2);font-weight:500}
.market-item .inst{color:var(--ink3);font-size:11px;flex:none}
.market-item .add{
  flex:none;font-size:11px;color:var(--accent);font-weight:600;
  border:1px solid var(--accent);border-radius:99px;padding:1px 8px;
}
.market-item.installing{opacity:.55;pointer-events:none}
.slash-busy{padding:10px 14px;color:var(--ink3);font-size:12.5px}
.picked-row{
  display:flex;flex-wrap:wrap;gap:6px;align-items:center;
  justify-content:center;margin-top:10px;
}
.picked-row[hidden]{display:none}
.picked-row .lead{color:var(--ink3);font-size:12px}
.picked-tag{
  display:inline-flex;align-items:center;gap:5px;font-size:12px;
  background:var(--accent-soft);color:var(--accent);border-radius:99px;
  padding:4px 9px;font-weight:550;
}
.picked-tag button{
  border:0;background:none;color:inherit;cursor:pointer;font-size:13px;
  padding:0 0 0 1px;line-height:1;opacity:.75;
}
.picked-tag button:hover{opacity:1}

.skills-bar{
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  justify-content:center;margin-top:16px;
}
.skills-bar .lead{color:var(--ink3);font-size:12.5px;margin-right:2px}

/* ---------- 技能按钮 + 管理面板 ---------- */
.skill-btn{
  border:1px solid var(--line);background:var(--panel);color:var(--ink2);
  border-radius:12px;padding:9px 12px;font-size:13.5px;cursor:pointer;flex:none;
  display:inline-flex;align-items:center;gap:6px;transition:.15s;
  font-family:inherit;line-height:1;
}
.skill-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.skill-btn.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.skill-btn .ico{font-size:12px}
.skill-btn .cnt{
  background:var(--accent);color:#fff;border-radius:99px;font-size:10.5px;
  padding:1px 5px;font-weight:600;min-width:15px;text-align:center;
}
@media (max-width:560px){ .skill-btn .lbl{display:none} }

.skill-panel{
  margin-top:14px;text-align:left;background:var(--panel);
  border:1px solid var(--line);border-radius:16px;overflow:hidden;
  box-shadow:0 8px 30px rgba(0,0,0,.07);animation:in .18s cubic-bezier(.2,.7,.3,1) both;
}
@media (prefers-color-scheme: dark){
  .skill-panel{box-shadow:0 12px 40px rgba(0,0,0,.55)}
}
.skill-panel[hidden]{display:none}
.sp-head{
  display:flex;align-items:center;gap:10px;padding:11px 13px;
  border-bottom:1px solid var(--line2);
}
.sp-tabs{display:flex;gap:4px;background:var(--line2);border-radius:10px;padding:3px}
.sp-tab{
  border:0;background:none;color:var(--ink2);font-size:12.5px;cursor:pointer;
  padding:5px 11px;border-radius:8px;font-family:inherit;white-space:nowrap;
}
.sp-tab.on{background:var(--panel);color:var(--ink);font-weight:550;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.sp-tab .n{color:var(--ink3);font-size:11px;margin-left:3px}
.sp-search{flex:1;min-width:0}
.sp-search input{
  width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--bg);
  border-radius:9px;padding:6px 10px;font-size:12.5px;color:var(--ink);
  font-family:inherit;outline:none;
}
.sp-search input:focus{border-color:var(--accent)}

.sp-toolbar{
  display:flex;align-items:center;gap:8px;padding:9px 13px;
  border-bottom:1px solid var(--line2);flex-wrap:wrap;
}
.sp-toolbar .sp-search{flex:1;min-width:130px}
.sp-add{
  border:1px solid var(--line);background:var(--panel);color:var(--ink2);
  border-radius:9px;padding:6px 10px;font-size:12px;cursor:pointer;
  font-family:inherit;white-space:nowrap;transition:.14s;
}
.sp-add:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

/* sub-filter under the agents tab */
.sp-sub{
  display:flex;flex-wrap:wrap;gap:6px;align-items:center;
  padding:9px 13px 4px;border-bottom:1px solid var(--line2);
}
.sp-sub[hidden]{display:none}
.sp-pill{
  border:1px solid var(--line);background:var(--panel);color:var(--ink2);
  border-radius:99px;padding:4px 10px;font-size:11.5px;cursor:pointer;
  font-family:inherit;white-space:nowrap;transition:.14s;
}
.sp-pill.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:550}
.sp-pill .n{opacity:.65;margin-left:3px}
.sp-pill[disabled]{opacity:.45;cursor:default}
.sp-where{
  font-size:10.5px;color:var(--ink3);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

/* drop zone */
.sp-drop{
  margin:8px;padding:20px 16px;border:1.5px dashed var(--line);
  border-radius:12px;text-align:center;color:var(--ink3);font-size:12.5px;
  transition:.16s;background:var(--bg);
}
.sp-drop .sp-drop-inner .arrow{font-size:17px;margin-bottom:4px;opacity:.6}
.sp-drop .hint{font-size:11px;margin-top:4px;opacity:.75}
.sp-drop.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.sp-drop.active .hint{color:var(--accent);opacity:.9}

/* whole-page drop overlay */
.page-drop{
  position:fixed;inset:0;z-index:120;display:none;
  align-items:center;justify-content:center;
  background:rgba(0,113,227,.10);backdrop-filter:blur(2px);
}
.page-drop.on{display:flex}
.page-drop .box{
  background:var(--panel);border:2px dashed var(--accent);border-radius:20px;
  padding:34px 46px;text-align:center;color:var(--accent);
  box-shadow:0 18px 60px rgba(0,0,0,.25);
}
.page-drop .box .big{font-size:30px;margin-bottom:8px}
.page-drop .box .t{font-size:15px;font-weight:600}
.page-drop .box .s{font-size:12.5px;color:var(--ink2);margin-top:6px}

.sp-import-note{
  margin:6px;padding:9px 12px;border-radius:10px;font-size:12px;
  background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent);
}
.sp-close{
  border:0;background:none;color:var(--ink3);cursor:pointer;font-size:15px;
  padding:4px 6px;border-radius:8px;flex:none;
}
.sp-close:hover{color:var(--ink);background:var(--line2)}
.sp-body{max-height:330px;overflow-y:auto;padding:6px}
.sp-row{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px}
.sp-row:hover{background:var(--line2)}
.sp-row .main{flex:1;min-width:0}
.sp-row .nm{font-size:13.5px;font-weight:550;color:var(--ink);display:flex;align-items:center;gap:6px}
.sp-row .ds{
  font-size:12px;color:var(--ink3);margin-top:2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;line-height:1.45;
}
.sp-row .meta{font-size:11px;color:var(--ink3);margin-top:3px}
.sp-official{
  font-size:9.5px;padding:1px 5px;border-radius:99px;font-weight:600;
  background:var(--accent-soft);color:var(--accent);flex:none;
}
.sp-act{
  flex:none;border:1px solid var(--line);background:var(--panel);color:var(--ink2);
  border-radius:8px;padding:5px 11px;font-size:12px;cursor:pointer;font-family:inherit;
  transition:.14s;white-space:nowrap;
}
.sp-act:hover{border-color:var(--accent);color:var(--accent)}
.sp-act.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:550}
.sp-act.primary:hover{opacity:.9;color:#fff}
.sp-act.picked{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.sp-act[disabled]{opacity:.5;cursor:default}
.sp-error{
  display:flex;gap:10px;align-items:flex-start;margin:6px;padding:10px 12px;
  background:rgba(229,72,77,.08);border:1px solid rgba(229,72,77,.28);
  border-radius:10px;
}
.sp-error .msg{
  flex:1;min-width:0;font-size:12px;line-height:1.55;color:var(--ink);
  word-break:break-word;
}
.sp-empty{padding:26px 18px;text-align:center;color:var(--ink3);font-size:13px;line-height:1.7}
.sp-empty code{font-family:var(--mono);font-size:11.5px;background:var(--line2);padding:2px 5px;border-radius:5px}
.sp-foot{
  padding:9px 13px;border-top:1px solid var(--line2);color:var(--ink3);
  font-size:11.5px;display:flex;align-items:center;gap:8px;
}
.sp-foot .spacer{flex:1}
.sp-foot code{font-family:var(--mono);font-size:11px;background:var(--line2);padding:1px 5px;border-radius:5px}
.skill-chip{
  border:1px solid var(--line);background:var(--panel);color:var(--ink2);
  border-radius:99px;padding:6px 13px;font-size:12.5px;cursor:pointer;
  transition:.15s;display:inline-flex;align-items:center;gap:6px;
}
.skill-chip:hover{border-color:var(--accent);color:var(--accent)}
.skill-chip.on{
  border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:500;
}
.skill-chip .tick{font-size:11px;opacity:0;transition:.15s}
.skill-chip.on .tick{opacity:1}
.skill-chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.hints{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
.hints button{
  border:1px solid var(--line);background:var(--panel);color:var(--ink2);
  border-radius:99px;padding:7px 14px;font-size:12.5px;cursor:pointer;
  transition:.15s;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.hints button:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

/* ---------- feed ---------- */
.feed{margin-top:58px}
.feed-head{display:flex;align-items:baseline;gap:12px;margin-bottom:16px;padding:0 2px}
.feed-head h2{font-size:17px;font-weight:600;letter-spacing:-.012em}
.feed-head .count{color:var(--ink3);font-size:12.5px}
.feed-head .spacer{flex:1}
.feed-head button{
  border:0;background:none;color:var(--ink3);font-size:12.5px;cursor:pointer;
  padding:4px 2px;border-radius:6px;
}
.feed-head button:hover{color:var(--accent)}

.card{
  background:var(--panel);border:1px solid var(--line);border-radius:16px;
  padding:18px 20px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.03);
  animation:in .28s cubic-bezier(.2,.7,.3,1) both;
}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.card .meta{display:flex;align-items:center;gap:9px;margin-bottom:9px;padding-right:30px}
.state{
  font-size:11.5px;font-weight:600;letter-spacing:.01em;
  padding:3px 9px;border-radius:99px;flex:none;
}
.state.ok{color:var(--ok);background:var(--ok-soft)}
.state.error{color:var(--err);background:var(--err-soft)}
.state.active{color:var(--accent);background:var(--accent-soft)}
.state.waiting{color:var(--wait);background:var(--wait-soft)}
.state.muted{color:var(--ink2);background:var(--line2)}
.card .when{color:var(--ink3);font-size:12px;margin-left:auto;flex:none}

.card .ask{
  font-size:14px;color:var(--ink2);margin-bottom:10px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.card .verdict{
  font-size:16.5px;line-height:1.5;letter-spacing:-.012em;
  word-break:break-word;
}
.card .verdict code{
  font-family:var(--mono);font-size:.88em;background:var(--line2);
  padding:1.5px 5px;border-radius:5px;word-break:break-all;
}
.card .fail{
  margin-top:10px;font-size:13.5px;color:var(--err);background:var(--err-soft);
  border-radius:10px;padding:10px 13px;line-height:1.5;word-break:break-word;
}

.files{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.file{
  display:flex;align-items:center;gap:9px;border:1px solid var(--line);
  background:var(--bg);border-radius:11px;padding:9px 13px;cursor:pointer;
  transition:.15s;text-align:left;max-width:100%;
}
.file:hover{border-color:var(--accent);background:var(--accent-soft)}
.file .ic{font-size:15px;flex:none;line-height:1}
.file .fn{
  font-family:var(--mono);font-size:12.5px;font-weight:500;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:250px;
}
.file .fs{font-size:11.5px;color:var(--ink3);flex:none}

.more{margin-top:12px}
.more summary{
  cursor:pointer;color:var(--ink3);font-size:12.5px;list-style:none;
  display:inline-flex;align-items:center;gap:5px;user-select:none;
}
.more summary::-webkit-details-marker{display:none}
.more summary::before{content:"›";display:inline-block;transition:.2s;font-size:15px;line-height:1}
.more[open] summary::before{transform:rotate(90deg)}
.more summary:hover{color:var(--accent)}
.steps{margin-top:11px;border-left:2px solid var(--line);padding-left:15px}
.steps li{
  list-style:none;font-size:13px;color:var(--ink2);padding:3.5px 0;
  display:flex;gap:8px;align-items:baseline;
}
.steps li .dot{
  width:5px;height:5px;border-radius:50%;background:var(--ink3);flex:none;
  transform:translateY(-2px);
}
.steps li.ok .dot{background:var(--ok)}
.steps li.error .dot{background:var(--err)}
.steps li.active .dot{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

.empty{
  text-align:center;color:var(--ink3);padding:56px 20px;
  border:1px dashed var(--line);border-radius:16px;font-size:14px;
}

/* thread continuation badge bar */
.thread-bar{
  margin:18px auto 6px;max-width:100%;display:none;align-items:center;gap:10px;
  background:var(--accent-soft);border:1px solid rgba(0,113,227,.25);border-radius:12px;
  padding:8px 14px;font-size:13px;color:var(--accent);text-align:left;animation:in .2s ease;
}
.thread-bar.show{display:flex}
.thread-bar .txt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:550}
.thread-bar .cancel{
  border:0;background:none;color:var(--accent);cursor:pointer;font-weight:600;
  padding:2px 8px;border-radius:6px;font-size:12px;white-space:nowrap;
}
.thread-bar .cancel:hover{background:rgba(0,113,227,.15)}

/* feed category tabs & filters */
.filter-tabs{
  display:flex;align-items:center;gap:6px;overflow-x:auto;padding-bottom:12px;
  border-bottom:1px solid var(--line);margin-bottom:18px;
}
.ftab{
  border:1px solid transparent;background:none;color:var(--ink2);
  padding:6px 13px;border-radius:99px;font-size:13px;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:.15s;
}
.ftab:hover{background:var(--line2);color:var(--ink)}
.ftab.on{background:var(--ink);color:var(--bg);font-weight:600}
.ftab .cnt{
  font-size:11px;padding:1px 6px;border-radius:99px;background:rgba(128,128,128,.18);
}
.ftab.on .cnt{background:rgba(255,255,255,.25)}
.fspacer{flex:1}
.filter-btn{
  border:1px solid var(--line);background:var(--panel);color:var(--ink2);
  padding:6px 12px;border-radius:99px;font-size:12.5px;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:.15s;
}
.filter-btn:hover{border-color:var(--accent);color:var(--accent)}
.filter-btn.on{background:var(--accent-soft);border-color:rgba(0,113,227,.35);color:var(--accent);font-weight:600}

/* ---------- rendered markdown inside a result ---------- */
.verdict .md-p{margin:0 0 8px}
.verdict .md-p:last-child{margin-bottom:0}
.verdict .md-h{margin:14px 0 8px;font-size:15px;font-weight:650;letter-spacing:-.01em;line-height:1.35}
.verdict h1.md-h{font-size:19px}
.verdict h2.md-h{font-size:17px}
.verdict h3.md-h{font-size:15.5px}
.verdict .md-list{margin:6px 0 10px;padding-left:20px}
.verdict .md-list li{margin:3px 0;line-height:1.55}
.verdict .md-hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.verdict .md-quote{
  margin:8px 0;padding:6px 0 6px 12px;border-left:3px solid var(--line);
  color:var(--ink2);font-size:14px;
}
.verdict .md-quote .md-p{margin:0}
.verdict .md-code{
  margin:10px 0;padding:12px 14px;background:var(--bg);
  border:1px solid var(--line);border-radius:10px;overflow-x:auto;
  font-family:var(--mono);font-size:12px;line-height:1.65;
  white-space:pre;tab-size:2;
}
.verdict .md-code code{background:none;padding:0;font-size:inherit}
.verdict .md-table-wrap{
  margin:10px 0;overflow-x:auto;border:1px solid var(--line);border-radius:10px;
}
.verdict .md-table{border-collapse:collapse;width:100%;font-size:13px}
.verdict .md-table th{
  background:var(--line2);font-weight:600;text-align:left;
  padding:7px 12px;border-bottom:1px solid var(--line);white-space:nowrap;
}
.verdict .md-table td{
  padding:7px 12px;border-bottom:1px solid var(--line2);vertical-align:top;
}
.verdict .md-table tr:last-child td{border-bottom:0}
.verdict a{color:var(--accent);text-decoration:none;border-bottom:1px solid rgba(0,113,227,.3)}
.verdict a:hover{border-bottom-color:var(--accent)}
.verdict del{color:var(--ink3)}

/* execution telemetry: two labelled rows, so "this run" and "whole thread"
   are never mistaken for each other */
.metrics{
  display:flex;flex-direction:column;gap:6px;
  margin-top:12px;padding-top:10px;border-top:1px solid var(--line2);
}
.metric-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.metric-label{
  font-size:10.5px;color:var(--ink3);flex:none;min-width:64px;
  letter-spacing:.01em;
}
.metric{
  font-family:var(--mono);font-size:10.5px;color:var(--ink2);
  background:var(--line2);border-radius:6px;padding:2.5px 8px;white-space:nowrap;
  cursor:help;
}
.metric-row:last-child .metric{opacity:.82}

/* card action bar */
.card-actions{
  display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:12px;
  border-top:1px solid var(--line2);
}
.act-btn{
  border:0;background:none;color:var(--ink2);font-size:12.5px;cursor:pointer;
  padding:5px 10px;border-radius:8px;display:inline-flex;align-items:center;gap:5px;
  transition:.15s;
}
.act-btn:hover{background:var(--line2);color:var(--accent)}
.act-btn.primary{color:var(--accent);font-weight:550}
.act-btn.primary:hover{background:var(--accent-soft)}

/* deep trace / step flow */
.trace{margin-top:12px}
.trace summary{
  cursor:pointer;color:var(--ink3);font-size:12.5px;list-style:none;
  display:inline-flex;align-items:center;gap:5px;user-select:none;padding:3px 0;
}
.trace summary::-webkit-details-marker{display:none}
.trace summary::before{content:"›";display:inline-block;transition:.2s;font-size:14px;line-height:1}
.trace[open] summary::before{transform:rotate(90deg)}
.trace summary:hover{color:var(--accent)}

.step-list{margin-top:12px;border-left:2px solid var(--line);padding-left:14px}
.step-item{list-style:none;margin-bottom:14px;font-size:13px}
.step-head{display:flex;align-items:baseline;gap:8px}
.step-item .dot{
  width:6px;height:6px;border-radius:50%;background:var(--ink3);flex:none;
  transform:translateY(-2px);
}
.step-item.ok .dot{background:var(--ok)}
.step-item.error .dot{background:var(--err)}
.step-item.active .dot{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.step-title{font-weight:600;color:var(--ink);letter-spacing:-.01em}
.step-summary{color:var(--ink2);font-size:12.5px;margin:2px 0 6px 14px;line-height:1.5}

/* step detail drawer / deep evidence */
.sub-trace{margin:4px 0 0 14px}
.sub-trace summary{
  cursor:pointer;color:var(--accent);font-size:11.5px;font-family:var(--mono);
  list-style:none;display:inline-flex;align-items:center;gap:4px;
}
.sub-trace summary::-webkit-details-marker{display:none}
.sub-trace summary::before{content:"▾";display:inline-block;font-size:10px}
.sub-trace[open] summary::before{content:"▴"}
.evidence-box{
  background:var(--bg);border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;margin-top:6px;font-size:12px;
}
.ev-row{margin-bottom:8px}
.ev-row:last-child{margin-bottom:0}
.ev-label{
  display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;
  color:var(--ink2);margin-bottom:3px;
}
.ev-badge{
  font-family:var(--mono);font-size:10px;padding:1px 5px;border-radius:4px;
  background:var(--line2);color:var(--ink3);font-weight:normal;
}
.ev-content{
  font-family:var(--mono);font-size:11.5px;color:var(--ink);
  white-space:pre-wrap;word-break:break-all;line-height:1.55;
  max-height:220px;overflow-y:auto;background:var(--panel);
  padding:6px 8px;border-radius:6px;border:1px solid var(--line2);
}

/* ---------- output files shelf ---------- */
.shelf{margin-top:48px;padding-top:28px;border-top:1px solid var(--line)}
.shelf-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.shelf-title{display:flex;align-items:baseline;gap:8px}
.shelf-title h2{font-size:17px;font-weight:600;letter-spacing:-.012em}
.shelf-title .count{color:var(--ink3);font-size:12.5px}
.shelf-search-wrap input{
  border:1px solid var(--line);background:var(--panel);border-radius:99px;
  padding:5px 14px;font-size:12.5px;color:var(--ink);width:220px;
  outline:none;transition:border-color .15s;
}
.shelf-search-wrap input:focus{border-color:var(--accent)}

.shelf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.shelf-tile{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;cursor:pointer;transition:.15s;text-align:left;position:relative;
  display:flex;flex-direction:column;gap:6px;
}
.shelf-tile:hover{border-color:var(--accent);box-shadow:0 4px 14px rgba(0,113,227,.08);transform:translateY(-1px)}
.shelf-tile-top{display:flex;align-items:center;gap:8px}
.shelf-tile-ic{font-size:18px;line-height:1;flex:none}
.shelf-tile-name{
  font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;
}
.shelf-tile-size{font-size:11px;color:var(--ink3);flex:none}
.shelf-tile-task{
  font-size:11.5px;color:var(--ink2);line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.shelf-tile-time{font-size:10.5px;color:var(--ink3);margin-top:auto}

/* ---------- per-card / per-file action menu ---------- */
.card{position:relative}
.card-menu-btn{
  position:absolute;top:16px;right:12px;width:24px;height:24px;border-radius:7px;
  border:0;background:none;color:var(--ink3);cursor:pointer;font-size:15px;
  line-height:1;display:grid;place-items:center;opacity:0;transition:.15s;
}
.card:hover .card-menu-btn,.card-menu-btn:focus-visible{opacity:1}
@media (hover:none){
  /* No hover on touch: an invisible control would be unreachable. */
  .card-menu-btn,.tile-menu-btn{opacity:.55}
}
.card-menu-btn:hover{background:var(--line2);color:var(--ink)}

.menu-pop{
  position:absolute;z-index:40;min-width:158px;background:var(--panel);
  border:1px solid var(--line);border-radius:12px;padding:5px;
  box-shadow:0 10px 34px rgba(0,0,0,.16);
  animation:in .12s ease both;
}
@media (prefers-color-scheme: dark){
  .menu-pop{box-shadow:0 12px 34px rgba(0,0,0,.6)}
}
.menu-item{
  display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;
  color:var(--ink);font-size:13px;text-align:left;padding:8px 10px;
  border-radius:8px;cursor:pointer;white-space:nowrap;
}
.menu-item:hover{background:var(--line2)}
.menu-item.danger{color:var(--err)}
.menu-item.danger:hover{background:var(--err-soft)}
.menu-sep{height:1px;background:var(--line2);margin:5px 4px}
.menu-label{
  font-size:10.5px;color:var(--ink3);padding:6px 10px 4px;
  font-family:var(--mono);letter-spacing:.06em;
}
.swatches{display:flex;gap:6px;padding:2px 10px 8px}
.swatch{
  width:20px;height:20px;border-radius:50%;border:2px solid transparent;
  cursor:pointer;transition:.15s;padding:0;
}
.swatch:hover{transform:scale(1.15)}
.swatch.on{border-color:var(--ink)}
.swatch.none{
  background:var(--panel);border:1.5px dashed var(--ink3);
  position:relative;
}
.swatch.none::after{
  content:"×";position:absolute;inset:0;display:grid;place-items:center;
  font-size:11px;color:var(--ink3);line-height:1;
}

/* pinned / archived / coloured states */
.card.pinned{border-color:rgba(0,113,227,.35);box-shadow:0 1px 2px rgba(0,0,0,.03),0 0 0 1px rgba(0,113,227,.12)}
.card.archived{opacity:.62}
.card.archived:hover{opacity:1}
.pin-badge{
  font-size:10.5px;padding:2px 7px;border-radius:99px;
  background:var(--accent-soft);color:var(--accent);font-weight:600;flex:none;
}
.skill-badge{
  font-size:10.5px;padding:2px 8px;border-radius:99px;flex:none;
  background:var(--ok-soft);color:var(--ok);font-weight:600;
}
.card[data-color="red"]{border-left:3px solid #e5484d}
.card[data-color="orange"]{border-left:3px solid #f76b15}
.card[data-color="yellow"]{border-left:3px solid #f5d90a}
.card[data-color="green"]{border-left:3px solid #30a46c}
.card[data-color="blue"]{border-left:3px solid #0090ff}
.card[data-color="purple"]{border-left:3px solid #8e4ec6}
.card[data-color="gray"]{border-left:3px solid var(--ink3)}

/* shelf tile menu */
.shelf-tile{position:relative}
.tile-menu-btn{
  position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:6px;
  border:0;background:var(--panel);color:var(--ink3);cursor:pointer;font-size:13px;
  line-height:1;display:grid;place-items:center;opacity:0;transition:.15s;
}
.shelf-tile:hover .tile-menu-btn,.tile-menu-btn:focus-visible{opacity:1}
.tile-menu-btn:hover{background:var(--line2);color:var(--ink)}

/* list folding */
.fold-more{
  display:block;width:100%;margin:4px 0 14px;padding:11px;border-radius:12px;
  border:1px dashed var(--line);background:var(--panel);color:var(--ink2);
  font-size:13px;cursor:pointer;transition:.15s;
}
.fold-more:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

/* ---------- viewer ---------- */
.viewer{
  border:0;padding:0;width:min(1000px,92vw);height:min(760px,86vh);
  border-radius:18px;background:var(--panel);box-shadow:0 24px 80px rgba(0,0,0,.3);
  overflow:hidden;color:var(--ink);
}
.viewer::backdrop{background:rgba(0,0,0,.42);backdrop-filter:blur(3px)}
.viewer .vhead{
  display:flex;align-items:center;gap:12px;padding:13px 16px;
  border-bottom:1px solid var(--line);background:var(--panel);
}
.viewer .vhead .vn{
  font-family:var(--mono);font-size:12.5px;font-weight:500;flex:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.viewer .vhead a,.viewer .vhead button{
  border:1px solid var(--line);background:none;border-radius:9px;
  padding:6px 12px;font-size:12.5px;cursor:pointer;color:var(--ink2);
  text-decoration:none;white-space:nowrap;
}
.viewer .vhead a:hover,.viewer .vhead button:hover{border-color:var(--accent);color:var(--accent)}
.viewer iframe{width:100%;height:calc(100% - 52px);border:0;background:#fff;display:block}
.viewer pre{
  margin:0;padding:20px;height:calc(100% - 52px);overflow:auto;
  font-family:var(--mono);font-size:12.5px;line-height:1.7;white-space:pre-wrap;
  word-break:break-word;background:var(--bg);
}

.foot{
  margin-top:52px;text-align:center;color:var(--ink3);font-size:12px;
}
.foot a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line)}
.foot a:hover{color:var(--ink2)}

.toast{
  position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:99px;
  font-size:13.5px;opacity:0;pointer-events:none;transition:.26s;z-index:90;
  max-width:88vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="mark"></div>
    <div class="name">Super Agent</div>
    <div class="spacer"></div>
    <select id="model" aria-label="模型"></select>
    <button class="notify" id="notify-toggle" type="button" title="完成后弹出桌面通知">通知</button>
    <a class="quiet" href="/ops">运维</a>
  </div>

  <section class="hero">
    <h1>你想让它做什么？</h1>
    <p class="sub">说一句话就行。它会真的把东西做出来给你。</p>
    <div class="thread-bar" id="thread-bar">
      <span>💬</span>
      <span class="txt" id="thread-msg">正在续接上下文…</span>
      <button class="cancel" id="thread-cancel" type="button">✕ 结束续接，发起新任务</button>
    </div>
    <div class="composer-wrap">
      <form class="composer" id="composer">
        <textarea id="input" rows="1" placeholder="例如：做一个介绍 CSS Grid 的网页，存成 grid.html（输入 / 选技能）"></textarea>
        <button class="skill-btn" id="skill-btn" type="button" title="技能：选一个、装一个（也可在输入框打 /）">
          <span class="ico">✦</span><span class="lbl">技能</span><span class="cnt" id="skill-count" hidden>0</span>
        </button>
        <button class="send" id="send" type="submit"><span class="spin"></span>开始</button>
      </form>
      <div class="slash-menu" id="slash-menu" hidden role="listbox" aria-label="技能列表"></div>
    </div>
    <div class="picked-row" id="picked-row" hidden></div>
    <section class="skill-panel" id="skill-panel" hidden aria-label="技能">
      <div class="sp-head">
        <div class="sp-tabs">
          <button class="sp-tab on" data-sp-tab="installed" type="button">
            已安装 <span class="n" id="sp-installed-n">0</span>
          </button>
          <button class="sp-tab" data-sp-tab="agents" type="button">
            其他 agent <span class="n" id="sp-agents-n">0</span>
          </button>
          <button class="sp-tab" data-sp-tab="market" type="button">Skill 市场</button>
        </div>
        <button class="sp-close" id="sp-close" type="button" title="关闭">✕</button>
      </div>

      <div class="sp-toolbar">
        <div class="sp-search">
          <input type="text" id="sp-q" placeholder="搜索技能名或用途…" autocomplete="off" />
        </div>
        <button class="sp-add" id="sp-add-link" type="button" title="从目录路径或 git 链接安装">
          🔗 链接 / 目录
        </button>
        <button class="sp-add" id="sp-add-file" type="button" title="选择压缩包或文件夹">
          📁 选择文件
        </button>
      </div>

      <div class="sp-sub" id="sp-sub" hidden></div>

      <div class="sp-body" id="sp-body"></div>

      <div class="sp-drop" id="sp-drop">
        <div class="sp-drop-inner">
          <div class="arrow">↓</div>
          <div>把<strong>文件夹</strong>或<strong>压缩包</strong>（.zip / .tar.gz）拖到这里</div>
          <div class="hint">也可以直接拖到页面任何位置</div>
        </div>
      </div>

      <div class="sp-foot" id="sp-foot"></div>

      <input type="file" id="sp-file" multiple hidden
             accept=".zip,.tar,.gz,.tgz,.bz2,.xz" />
      <input type="file" id="sp-dir" webkitdirectory directory multiple hidden />
    </section>
    <div class="skills-bar" id="skills-bar" hidden>
      <span class="lead">用技能：</span>
    </div>
    <div class="hints" id="hints"></div>
  </section>

  <section class="feed">
    <div class="filter-tabs">
      <button class="ftab on" data-cat="running" type="button">正在进行 <span class="cnt" id="c-running">0</span></button>
      <button class="ftab" data-cat="succeeded" type="button">已经做好 <span class="cnt" id="c-succeeded">0</span></button>
      <button class="ftab" data-cat="failed" type="button">执行失败 <span class="cnt" id="c-failed">0</span></button>
      <button class="ftab" data-cat="cancelled" type="button">已取消 <span class="cnt" id="c-cancelled">0</span></button>
      <button class="ftab" data-cat="all" type="button">全部 <span class="cnt" id="c-all">0</span></button>
      <div class="fspacer"></div>
      <button class="filter-btn" id="f-archived" type="button">📦 显示已归档</button>
      <button class="filter-btn" id="f-artifacts" type="button">📄 只看有产物的卡片</button>
    </div>
    <div id="list"><div class="empty">当前没有正在跑的任务。点「已经做好」查看成果，或在上方发起新任务。</div></div>
  </section>

  <!-- Output Files Shelf underneath results -->
  <section class="shelf" id="artifacts-shelf">
    <div class="shelf-head">
      <div class="shelf-title">
        <h2>产出文件</h2>
        <span class="count" id="shelf-count">0 个文件</span>
      </div>
      <div class="fspacer"></div>
      <div class="shelf-search-wrap">
        <input type="text" id="shelf-search" placeholder="🔍 快速筛选文件名（如 .html、grid）…" />
      </div>
    </div>
    <div class="shelf-grid" id="shelf-grid">
      <div class="empty" style="padding:32px">正在加载产出文件…</div>
    </div>
  </section>

  <div class="foot">任务跑在你自己机器上 · <a href="/docs">接口文档</a></div>
</div>

<dialog class="viewer" id="viewer">
  <div class="vhead">
    <div class="vn" id="vn"></div>
    <a id="vopen" href="#" target="_blank" rel="noopener">新窗口</a>
    <button id="vclose">关闭</button>
  </div>
  <iframe id="vframe" src="about:blank" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
  <pre id="vtext" style="display:none"></pre>
</dialog>

const STATE = {

  waiting: ["等你确认", "waiting"], succeeded: ["做好了", "ok"],
  failed: ["没做成", "error"], cancelled: ["已取消", "muted"],

};

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
/* ---------- Markdown renderer ----------
   Models answer in Markdown constantly - tables, lists, headings, fenced code.
   Showing that raw is the difference between a readable result and a wall of
   asterisks. This is a deliberately small renderer: it covers what answers
   actually use, escapes first so nothing can inject HTML, and leaves anything
   it does not understand as plain text rather than mangling it.
   No external CDN: the page must work offline and from a local install. */
function mdInline(s) {
  return esc(s)
    .replace(/`([^`\n]+)`/g, "<code>$1</code>")
    .replace(/\*\*\*([^*]+)\*\*\*/g, "<strong><em>$1</em></strong>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/~~([^~]+)~~/g, "<del>$1</del>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener">$1</a>');
}

function md(s) {
  const text = String(s ?? "").replace(/\r\n/g, "\n");
  const lines = text.split("\n");
  const out = [];
  let i = 0;

  while (i < lines.length) {
    const line = lines[i];

    const fence = line.match(/^\s*```(\w*)\s*$/);
    if (fence) {
      const lang = fence[1];
      const body = [];
      i++;
      while (i < lines.length && !/^\s*```\s*$/.test(lines[i])) {
        body.push(lines[i]);
        i++;
      }
      i++;
      out.push('<pre class="md-code"' + (lang ? ' data-lang="' + esc(lang) + '"' : "") +
        "><code>" + esc(body.join("\n")) + "</code></pre>");
      continue;
    }

    if (/^\s*\|.*\|\s*$/.test(line) && i + 1 < lines.length &&
        /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
      const cells = (row) => row.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
      const head = cells(line);
      i += 2;
      const rows = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) {
        rows.push(cells(lines[i]));
        i++;
      }
      out.push('<div class="md-table-wrap"><table class="md-table"><thead><tr>' +
        head.map((c) => "<th>" + mdInline(c) + "</th>").join("") +
        "</tr></thead><tbody>" +
        rows.map((r) => "<tr>" + r.map((c) => "<td>" + mdInline(c) + "</td>").join("") + "</tr>").join("") +
        "</tbody></table></div>");
      continue;
    }

    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) {
      const level = h[1].length;
      out.push("<h" + level + ' class="md-h">' + mdInline(h[2]) + "</h" + level + ">");
      i++;
      continue;
    }

    if (/^\s*([-*_])\1{2,}\s*$/.test(line)) {
      out.push('<hr class="md-hr">');
      i++;
      continue;
    }

    if (/^\s*>\s?/.test(line)) {
      const body = [];
      while (i < lines.length && /^\s*>\s?/.test(lines[i])) {
        body.push(lines[i].replace(/^\s*>\s?/, ""));
        i++;
      }
      out.push('<blockquote class="md-quote">' + md(body.join("\n")) + "</blockquote>");
      continue;
    }

    if (/^\s*[-*+]\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*[-*+]\s+/, ""));
        i++;
      }
      out.push('<ul class="md-list">' + items.map((x) => "<li>" + mdInline(x) + "</li>").join("") + "</ul>");
      continue;
    }

    if (/^\s*\d+[.)]\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*\d+[.)]\s+/, ""));
        i++;
      }
      out.push('<ol class="md-list">' + items.map((x) => "<li>" + mdInline(x) + "</li>").join("") + "</ol>");
      continue;
    }

    if (!line.trim()) {
      i++;
      continue;
    }

    const para = [];
    while (i < lines.length && lines[i].trim() &&
           !/^\s*(```|#{1,6}\s|[-*+]\s|\d+[.)]\s|>)/.test(lines[i]) &&
           !/^\s*\|.*\|\s*$/.test(lines[i])) {
      para.push(lines[i]);
      i++;
    }
    if (para.length) {
      out.push('<p class="md-p">' + mdInline(para.join(" ")) + "</p>");
    } else {
      i++;
    }
  }
  return out.join("");
}

function bytes(n) {
  if (n == null) return "";
  if (n < 1024) return n + " B";
  if (n < 1024 * 1024) return (n / 1024).toFixed(n < 10240 ? 1 : 0) + " KB";
  return (n / 1048576).toFixed(1) + " MB";
}
function when(iso) {
  if (!iso) return "";
  const d = new Date(iso), now = Date.now(), diff = (now - d.getTime()) / 1000;
  if (diff < 45) return "刚刚";
  if (diff < 3600) return Math.floor(diff / 60) + " 分钟前";
  if (diff < 86400 && d.getDate() === new Date().getDate())
    return d.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });
  if (diff < 86400 * 7) return Math.floor(diff / 86400) + " 天前";
  return d.toLocaleDateString("zh-CN", { month: "numeric", day: "numeric" });
}

async function api(path, init) {
  const r = await fetch(path, init);
  if (!r.ok) {
    let detail = r.statusText;
    try { detail = (await r.json()).detail || detail; } catch {}
    throw new Error(typeof detail === "string" ? detail : JSON.stringify(detail));
  }
  return r.json();
}
function toast(msg) {
  const t = $("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2600);
}

/* ---- desktop notification ----
   A task can run for minutes, so the page cannot be the only place a result
   shows up. Two rules keep this from being noise:
   1. Ask permission once, only after the user submits something. A permission
      prompt on first paint is hostile, and browsers penalise the asking.
   2. Only notify when the page is NOT visible. If the user is looking at the
      feed, the card appears in front of them and a system popup would be a
      second copy of the same news.
   Clicking the notification focuses this tab and opens that result. */
const Notify = {
  supported: () => typeof window.Notification !== "undefined",
  granted: () => Notify.supported() && Notification.permission === "granted",
  asked: false,

  async ask() {
    if (!Notify.supported() || Notification.permission !== "default") return;
    if (Notify.asked) return;
    Notify.asked = true;
    try { await Notification.requestPermission(); } catch {}
    paintNotifyButton();
  },

  show(title, body, taskId) {
    if (!Notify.granted() || document.visibilityState === "visible") return false;
    try {
      const n = new Notification(title, {
        body,
        tag: "task-" + (taskId || Date.now()),
        icon: "/favicon.ico",
        silent: false,
      });
      n.onclick = () => {
        window.focus();
        n.close();
        if (taskId) revealResult(taskId);
      };
      setTimeout(() => n.close(), 12000);
      return true;
    } catch { return false; }
  },
};

function paintNotifyButton() {
  const btn = $("notify-toggle");
  if (!btn) return;
  if (!Notify.supported()) { btn.style.display = "none"; return; }
  const p = Notification.permission;
  btn.style.display = "";
  if (p === "granted") {
    btn.textContent = "通知已开";
    btn.classList.add("on");
    btn.title = "完成后会弹出桌面通知";
  } else if (p === "denied") {
    btn.textContent = "通知被拦截";
    btn.classList.remove("on");
    btn.title = "浏览器已拦截通知，请在地址栏左侧的站点设置里允许";
  } else {
    btn.textContent = "开启通知";
    btn.classList.remove("on");
    btn.title = "完成后弹出桌面通知";
  }
}

$("notify-toggle").onclick = async () => {
  if (!Notify.supported()) return;
  if (Notification.permission === "granted") {
    toast("通知已经开着了");
    return;
  }
  if (Notification.permission === "denied") {
    toast("浏览器已拦截通知，去地址栏左侧的站点设置里改成允许");
    return;
  }
  await Notify.ask();
  if (Notify.granted()) toast("好了，做完会通知你");
};

function revealResult(taskId) {
  const el = document.querySelector('article.card[data-id="' + taskId + '"]');
  if (el) {
    el.scrollIntoView({ behavior: "smooth", block: "center" });
    el.classList.remove("flash");
    void el.offsetWidth;
    el.classList.add("flash");
    return;
  }
  loadFeed().then(() => {
    const again = document.querySelector('article.card[data-id="' + taskId + '"]');
    if (again) again.scrollIntoView({ behavior: "smooth", block: "center" });
  });
}

const COLORS = [
  ["", "无"],
  ["red", "红"],
  ["orange", "橙"],
  ["yellow", "黄"],
  ["green", "绿"],
  ["blue", "蓝"],
  ["purple", "紫"],

];

let openMenu = null;

function closeMenu() {
  if (openMenu) {
    openMenu.remove();
    openMenu = null;
  }
}
document.addEventListener("click", (e) => {
  if (openMenu && !openMenu.contains(e.target) &&
      !e.target.closest(".card-menu-btn") && !e.target.closest(".tile-menu-btn")) {
    closeMenu();
  }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeMenu(); });

function positionMenu(menu, anchorEl) {
  const rect = anchorEl.getBoundingClientRect();
  menu.style.position = "fixed";
  menu.style.top = Math.min(rect.bottom + 6, window.innerHeight - menu.offsetHeight - 12) + "px";
  menu.style.left = Math.max(8, Math.min(rect.right - 158, window.innerWidth - 170)) + "px";
}

async function patchFlags(taskId, patch) {
  try {
    const updated = await api("/api/tasks/" + taskId + "/flags", {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(patch),
    });
    const cur = S.items.get(taskId);
    if (cur) {
      cur.pinned = updated.pinned;
      cur.archived = updated.archived;
      cur.color = updated.color;
    }
    render();
    return true;
  } catch (e) {
    toast("没保存成功：" + e.message);
    return false;
  }
}

function buildCardMenu(r) {
  const menu = document.createElement("div");
  menu.className = "menu-pop";

  const pin = document.createElement("button");
  pin.className = "menu-item";
  pin.innerHTML = "<span>" + (r.pinned ? "📌" : "📍") + "</span><span>" +
    (r.pinned ? "取消置顶" : "置顶") + "</span>";
  pin.onclick = async (e) => {
    e.stopPropagation();
    closeMenu();
    await patchFlags(r.task_id, { pinned: !r.pinned });
  };
  menu.appendChild(pin);

  const archive = document.createElement("button");
  archive.className = "menu-item";
  archive.innerHTML = "<span>" + (r.archived ? "📤" : "📥") + "</span><span>" +
    (r.archived ? "取消归档" : "归档") + "</span>";
  archive.onclick = async (e) => {
    e.stopPropagation();
    closeMenu();
    await patchFlags(r.task_id, { archived: !r.archived });
  };
  menu.appendChild(archive);

  const sep = document.createElement("div");
  sep.className = "menu-sep";
  menu.appendChild(sep);

  const label = document.createElement("div");
  label.className = "menu-label";
  label.textContent = "标记颜色";
  menu.appendChild(label);

  const sw = document.createElement("div");
  sw.className = "swatches";
  for (const [value, name] of COLORS) {
    const b = document.createElement("button");
    b.className = "swatch" + (value === "" ? " none" : "") +
      ((r.color || "") === value ? " on" : "");
    if (value) b.style.background = "var(--c-" + value + ")";
    b.title = name;
    b.onclick = async (e) => {
      e.stopPropagation();
      closeMenu();
      await patchFlags(r.task_id, { color: value });
    };
    sw.appendChild(b);
  }
  menu.appendChild(sw);

  const sep2 = document.createElement("div");
  sep2.className = "menu-sep";
  menu.appendChild(sep2);

  const del = document.createElement("button");
  del.className = "menu-item danger";
  del.innerHTML = "<span>🗑️</span><span>删除任务</span>";
  del.onclick = async (e) => {
    e.stopPropagation();
    closeMenu();
    if (!confirm("删除这个任务？任务记录会一并移除，产出的文件保留在磁盘上。")) return;
    try {
      await api("/api/tasks/" + r.task_id, { method: "DELETE" });
      S.items.delete(r.task_id);
      render();
      toast("已删除");
    } catch (err) {
      toast("删除失败：" + err.message);
    }
  };
  menu.appendChild(del);

  return menu;
}

  const del = document.createElement("button");
  del.className = "menu-item danger";

    e.stopPropagation();

      await api("/api/files?path=" + encodeURIComponent(artifact.path), { method: "DELETE" });

  };
  menu.appendChild(del);

  return menu;
}

/* ---------- Context Continuation Mode ---------- */
function startContinuation(threadId, title) {
  if (!threadId) { toast("该任务缺少上下文线索，无法续接"); return; }
  S.continueThreadId = threadId;
  S.continueTaskTitle = title || "当前任务";
  $("thread-msg").textContent = "正在续接：" + S.continueTaskTitle + "（大模型将保留前序所有记忆）";
  $("thread-bar").classList.add("show");
  $("input").placeholder = "例如：把刚才生成的页面背景改成暗色、增加一个图表…";
  $("input").scrollIntoView({ behavior: "smooth", block: "center" });
  $("input").focus();
  toast("已载入前序对话上下文");
}

function cancelContinuation() {
  S.continueThreadId = null;
  S.continueTaskTitle = null;
  $("thread-bar").classList.remove("show");
  $("input").placeholder = "例如：做一个介绍 CSS Grid 的网页，存成 grid.html";
}
$("thread-cancel").onclick = cancelContinuation;

function cardHtml(r) {
  const [text, tone] = STATE[r.status] || [r.status, "muted"];
  const live = ["pending", "running", "waiting", "cancel_requested"].includes(r.status);
  const parts = [];

  parts.push('<button class="card-menu-btn" data-menu="' + esc(r.task_id) + '" type="button" title="更多操作">⋯</button>');
  parts.push('<div class="meta">');
  parts.push('<span class="state ' + tone + '">' + esc((r.state && r.state.text) || text) + '</span>');
  if (r.pinned) parts.push('<span class="pin-badge">📌 置顶</span>');
  if (r.skills && r.skills.length) {
    parts.push('<span class="skill-badge" title="本次任务套用的技能">✦ ' +
      esc(r.skills.join("、")) + '</span>');
  }
  if (r.archived) parts.push('<span class="pin-badge" style="background:var(--line2);color:var(--ink2)">已归档</span>');
  if (live) parts.push('<span class="state active">进行中</span>');
  if (r.duration_seconds != null) parts.push('<span class="duration">用了 ' + r.duration_seconds + ' 秒</span>');
  parts.push('<span class="when">' + esc(when(r.finished_at || r.started_at)) + '</span>');
  parts.push('</div>');

  if (r.ask && r.ask !== r.conclusion) {
    parts.push('<div class="ask">“' + esc(r.ask) + '”</div>');
  } else if (r.title && r.title !== r.conclusion) {
    parts.push('<div class="ask">“' + esc(r.title) + '”</div>');
  }

  parts.push('<div class="verdict">' + md(r.conclusion) + '</div>');

  if (r.error && r.error !== r.conclusion) {
    parts.push('<div class="fail">' + esc(r.error) + '</div>');
  }

  const arts = r.artifacts || [];
  if (arts.length) {
    parts.push('<div class="files">');
    for (const a of arts) {
      const ic = /\.(html?|htm)$/i.test(a.name) ? "🌐" : /\.(md|txt)$/i.test(a.name) ? "📝" : /\.(py|js|css|json)$/i.test(a.name) ? "⚙️" : "📄";
      parts.push('<button class="file" data-file="' + esc(a.path) + '" type="button">' +
        '<span class="ic">' + ic + '</span>' +
        '<span class="fn">' + esc(a.name) + '</span>' +
        '<span class="fs">' + bytes(a.size) + '</span></button>');
    }
    parts.push('</div>');
  }

  // Deep Process Trace
  const steps = r.steps || [];
  if (steps.length) {
    parts.push('<details class="trace"><summary>看看它是怎么做的（包含初筛、工具和参数细节）</summary><ul class="step-list">');
    for (const s of steps) {
      parts.push('<li class="step-item ' + esc(s.kind || "info") + '">');
      parts.push('<div class="step-head"><span class="dot"></span><span class="step-title">' + esc(s.text) + '</span></div>');
      if (s.summary && s.summary !== s.text) {
        parts.push('<div class="step-summary">' + esc(s.summary) + '</div>');
      }
      if (s.details && s.details.length) {
        parts.push('<details class="sub-trace"><summary>查看底层参数与真实证据</summary><div class="evidence-box">');
        for (const dt of s.details) {
          parts.push('<div class="ev-row">');
          parts.push('<div class="ev-label">' + esc(dt.label) + (dt.badge ? '<span class="ev-badge">' + esc(dt.badge) + '</span>' : '') + '</div>');
          parts.push('<div class="ev-content">' + esc(dt.content) + '</div>');
          parts.push('</div>');
        }
        parts.push('</div></details>');
      }
      parts.push('</li>');
    }
    parts.push('</ul></details>');
  }

  // Execution telemetry, in two clearly separated groups.
  // "This run" answers "what did the answer I'm reading cost?". "Whole thread"
  // answers "what has this conversation cost in total?" - different questions,
  // and a user could not tell them apart when they were one undifferentiated
  // strip of numbers.
  const m = r.metrics || {};
  const runBits = [];
  if (m.model_rounds) {
    runBits.push(['🔄 ' + m.model_rounds + ' 轮', '这次任务向大模型发起了几轮请求（工具调用会多轮）']);
  }
  if (m.tool_calls) {
    runBits.push(['🔧 ' + m.tool_calls + ' 次工具', '这次任务里模型实际调用了几次工具（读/写文件等）']);
  }
  if (m.prompt_tokens) {
    runBits.push(['↑ ' + m.prompt_tokens.toLocaleString() + ' 入', '这次任务发给大模型的 token 数（含历史上下文）']);
  }
  if (m.completion_tokens) {
    runBits.push(['↓ ' + m.completion_tokens.toLocaleString() + ' 出', '这次任务大模型生成的 token 数']);
  }
  if (m.cached_tokens) {
    runBits.push([
      '⚡ ' + Math.round((m.cache_hit_rate || 0) * 100) + '% 命中缓存',
      '这次输入里有 ' + m.cached_tokens.toLocaleString() +
      ' 个 token 命中了大模型的提示缓存，只有没命中的部分才按原价计费',
    ]);
  }

  const attempts = m.thread_attempts || 0;
  const threadDiffers =
    (m.thread_model_rounds || 0) > (m.model_rounds || 0) ||
    (m.thread_prompt_tokens || 0) > (m.prompt_tokens || 0);

  if (runBits.length || threadDiffers) {
    parts.push('<div class="metrics">');

    if (runBits.length) {
      parts.push('<div class="metric-row">');
      parts.push('<span class="metric-label">这一次</span>');
      for (const [label, tip] of runBits) {
        parts.push('<span class="metric" title="' + esc(tip) + '">' + esc(label) + '</span>');
      }
      parts.push('</div>');
    }

    if (threadDiffers) {
      const threadBits = [];
      if (m.thread_model_rounds) {
        threadBits.push([
          '🔄 ' + m.thread_model_rounds + ' 轮',
          '这个对话线程从头到现在累计的模型请求轮数（含失败重试）',
        ]);
      }
      if (m.thread_tool_calls) {
        threadBits.push([
          '🔧 ' + m.thread_tool_calls + ' 次工具',
          '这个线程累计调用工具的次数',
        ]);
      }
      if (m.thread_prompt_tokens) {
        threadBits.push([
          '↑ ' + m.thread_prompt_tokens.toLocaleString() + ' 入',
          '这个线程累计消耗的输入 token（每轮都会重发历史上下文，所以比单次多）',
        ]);
      }
      if (m.thread_cached_tokens) {
        threadBits.push([
          '⚡ ' + Math.round((m.thread_cache_hit_rate || 0) * 100) + '% 命中缓存',
          '这个线程累计的缓存命中率，越高说明重复内容越多、越省钱',
        ]);
      }
      parts.push('<div class="metric-row">');
      parts.push('<span class="metric-label">整个对话' +
        (attempts > 1 ? '（' + attempts + ' 次尝试）' : '') + '</span>');
      for (const [label, tip] of threadBits) {
        parts.push('<span class="metric" title="' + esc(tip) + '">' + esc(label) + '</span>');
      }
      parts.push('</div>');
    }

    parts.push('</div>');
  }

  // Card action bar
  parts.push('<div class="card-actions">');
  if (r.thread_id) {
    parts.push('<button class="act-btn primary" data-continue="' + esc(r.thread_id) + '" data-title="' + esc(r.ask || r.title || "") + '" type="button">💬 基于此任务继续</button>');
  }
  if (r.artifacts && r.artifacts.length && r.open_url) {
    parts.push('<button class="act-btn" data-file="' + esc(r.artifacts[0].path) + '" type="button">👁️ 预览首选产物</button>');
  }
  parts.push('</div>');

  const cls = "card" + (r.pinned ? " pinned" : "") + (r.archived ? " archived" : "");
  const colorAttr = r.color ? ' data-color="' + esc(r.color) + '"' : "";
  return '<article class="' + cls + '" id="r-' + esc(r.task_id) + '" data-id="' + esc(r.task_id) + '"' +
    colorAttr + '>' + parts.join("") + '</article>';
}

function updateCategoryCounts(all) {
  const counts = { all: all.length, running: 0, succeeded: 0, failed: 0, cancelled: 0 };
  for (const item of all) {
    if (["pending", "running", "waiting", "cancel_requested"].includes(item.status)) counts.running++;
    else if (item.status === "succeeded") counts.succeeded++;
    else if (["failed", "timed_out"].includes(item.status)) counts.failed++;
    else if (item.status === "cancelled") counts.cancelled++;
  }
  $("c-all").textContent = counts.all;
  $("c-running").textContent = counts.running;
  $("c-succeeded").textContent = counts.succeeded;
  $("c-failed").textContent = counts.failed;
  $("c-cancelled").textContent = counts.cancelled;
}

const FOLD_LIMIT = 6;

function render() {
  const list = $("list");
  const all = [...S.items.values()].sort((a, b) => {
    // Pinned cards always float to the top, regardless of recency.
    if (!!a.pinned !== !!b.pinned) return a.pinned ? -1 : 1;
    const av = String(a.finished_at || a.started_at || "");
    const bv = String(b.finished_at || b.started_at || "");
    if (av && bv && av !== bv) return av < bv ? 1 : -1;
    return (b._seq || 0) - (a._seq || 0);
  });

  updateCategoryCounts(all);

  let filtered = all.filter((r) => {
    // Archived work is hidden unless the user explicitly asks to see it.
    if (r.archived && !S.showArchived) return false;
    if (S.category === "running") return ["pending", "running", "waiting", "cancel_requested"].includes(r.status);
    if (S.category === "succeeded") return r.status === "succeeded";
    if (S.category === "failed") return ["failed", "timed_out"].includes(r.status);
    if (S.category === "cancelled") return r.status === "cancelled";
    return true;
  });

  if (S.onlyArtifacts) {
    filtered = filtered.filter((r) => r.artifacts && r.artifacts.length > 0);
  }

  if (!filtered.length) {
    const emptyHint = S.onlyArtifacts
      ? "没有找到生成了产物文件的任务。"
      : S.category !== "all"
      ? "当前分类下暂无任务。"
      : "还没有做过事情。上面写一句试试。";
    list.innerHTML = '<div class="empty">' + emptyHint + '</div>';
    return;
  }

  // Folding: a long history must not become an endless scroll. Pinned cards are
  // never folded away - the whole point of pinning is that it stays in sight.
  const expanded = S.expanded[S.foldKey] === true;
  const pinnedItems = filtered.filter((r) => r.pinned);
  const rest = filtered.filter((r) => !r.pinned);
  let shown = filtered;
  let hidden = 0;

  if (!expanded && rest.length > FOLD_LIMIT) {
    shown = pinnedItems.concat(rest.slice(0, FOLD_LIMIT));
    hidden = rest.length - FOLD_LIMIT;
  }

  let html = shown.map(cardHtml).join("");
  if (hidden > 0) {
    html += '<button class="fold-more" id="fold-more" type="button">还有 ' + hidden +
      ' 个更早的结果 · 展开全部</button>';
  } else if (expanded && rest.length > FOLD_LIMIT) {
    html += '<button class="fold-more" id="fold-less" type="button">收起，只看最近的 ' +
      FOLD_LIMIT + ' 个</button>';
  }
  list.innerHTML = html;

  list.querySelectorAll("[data-file]").forEach((b) => {
    b.onclick = () => openFile(b.dataset.file);
  });

  list.querySelectorAll("[data-continue]").forEach((b) => {
    b.onclick = () => startContinuation(b.dataset.continue, b.dataset.title);
  });

  list.querySelectorAll("[data-menu]").forEach((b) => {
    b.onclick = (e) => {
      e.stopPropagation();
      const already = openMenu && openMenu.dataset.for === b.dataset.menu;
      closeMenu();
      if (already) return;
      const r = S.items.get(b.dataset.menu);
      if (!r) return;
      const menu = buildCardMenu(r);
      menu.dataset.for = b.dataset.menu;
      document.body.appendChild(menu);
      positionMenu(menu, b);
      openMenu = menu;
    };
  });

  const more = $("fold-more");
  if (more) more.onclick = () => { S.expanded[S.foldKey] = true; render(); };
  const less = $("fold-less");
  if (less) less.onclick = () => { S.expanded[S.foldKey] = false; render(); };
}

/* ---------- viewer ---------- */
async function openFile(path) {
  const target = "/files/" + path.split("/").map(encodeURIComponent).join("/");
  const isHtml = /\.(html?|htm|svg)$/i.test(path);
  $("vn").textContent = path;
  $("vopen").href = target;
  $("vopen").style.display = isHtml ? "" : "none";
  const frame = $("vframe"), pre = $("vtext");
  if (isHtml) {
    pre.style.display = "none"; frame.style.display = "";
    frame.src = target;
  } else {
    frame.style.display = "none"; frame.src = "about:blank";
    pre.style.display = ""; pre.textContent = "读取中…";
    try {
      const d = await api("/api/files/content?path=" + encodeURIComponent(path));
      pre.textContent = d.text + (d.truncated ? "\n\n… （后面还有，已截断）" : "");
    } catch (e) { pre.textContent = "打不开：" + e.message; }
  }
  $("viewer").showModal();
}
$("vclose").onclick = () => { $("viewer").close(); $("vframe").src = "about:blank"; };
$("viewer").addEventListener("close", () => { $("vframe").src = "about:blank"; });

/* ---------- feed ---------- */
const TERMINAL = ["succeeded", "failed", "cancelled", "timed_out"];

async function loadFeed() {
  try {
    const d = await api("/api/results?limit=30");
    for (const item of d.items || []) {
      const known = S.items.get(item.task_id);
      if (known) {
        item._seq = known._seq;
        // Carry the announcement flag across the refresh, otherwise the same
        // finished task re-notifies on every poll.
        item._announced = known._announced;
        // The feed is also the only observer of tasks submitted from another
        // tab or before a reload: if one reaches a terminal state while this
        // page is open, say so - once.
        if (!TERMINAL.includes(known.status) && TERMINAL.includes(item.status)) {
          S.items.set(item.task_id, item);
          announce(item);
          continue;
        }
      } else {
        item._seq = ++S.seq;
        // A task that already finished before this page loaded must not fire a
        // notification for an event the user never waited for.
        if (TERMINAL.includes(item.status)) item._announced = true;
      }
      S.items.set(item.task_id, item);
    }
    render();
  } catch (e) {
    toast("读不到结果：" + e.message);
  }
}

function upsert(result) {
  const known = S.items.get(result.task_id);
  if (!known) {
    result._seq = ++S.seq;
  } else {
    result._seq = known._seq;
    // Carry the "already told the user" flag across every replacement.
    // Without this, each refresh produced a fresh object with the flag unset,
    // so the same finished task re-announced on every poll.
    if (known._announced) result._announced = true;
  }
  S.items.set(result.task_id, result);
  render();
}

/* ---------- submit ---------- */
async function submit(text) {
  const message = text.trim();
  if (!message) return;
  Notify.ask();

  $("send").disabled = true;
  $("send").classList.add("busy");
  $("input").value = "";
  autoGrow();

  const payload = {
    message,
    model: $("model").value || null,
  };
  if (S.continueThreadId) {
    payload.thread_id = S.continueThreadId;
  }
  if (S.pickedSkills.size) {
    payload.skills = [...S.pickedSkills];
  }

  const placeholder = {
    task_id: "pending-" + Date.now(),
    thread_id: S.continueThreadId,
    title: message,
    ask: message,
    status: "pending",
    state: { text: "排队中", tone: "waiting" },
    conclusion: S.continueThreadId ? "已载入前序上下文，正在继续对话与执行…" : "已经收到，开始安排了。",
    artifacts: [],
    steps: [
      { text: "收到任务", kind: "info", summary: S.continueThreadId ? "续接已有对话线程" : "开启新任务" }
    ].concat(S.pickedSkills.size ? [{
      text: "套用技能",
      kind: "info",
      summary: [...S.pickedSkills].join("、"),
    }] : []),
    finished_at: new Date().toISOString(),
    skills: S.pickedSkills.size ? [...S.pickedSkills] : [],
  };
  upsert(placeholder);

  if (S.continueThreadId) {
    cancelContinuation();
  }

  try {
    const d = await api("/api/tasks/async", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    poll(d.dedupe_key, placeholder.task_id, message);
  } catch (e) {
    upsert({ ...placeholder, status: "failed", state: { text: "没做成", tone: "error" },
             conclusion: "没能提交成功。", error: e.message });
    toast("提交失败：" + e.message);
  } finally {
    $("send").disabled = false;
    $("send").classList.remove("busy");
  }
}

function poll(dedupeKey, tempId, message) {
  let tries = 0;
  const tick = async () => {
    tries += 1;
    if (tries > 900) { finish(tempId, "超时了，去运维视图看看。"); return; }
    let st;
    try {
      st = await api("/api/tasks/status?dedupe_key=" + encodeURIComponent(dedupeKey));
    } catch { setTimeout(tick, 1200); return; }

    const terminal = ["succeeded", "failed", "cancelled", "completed", "ignored", "timed_out"];
    if (st.task_id) {
      try {
        const r = await api("/api/tasks/" + st.task_id + "/result");
        r._seq = S.items.get(tempId)?._seq || ++S.seq;
        if (tempId !== r.task_id) S.items.delete(tempId);
        upsert(r);
        if (terminal.includes(r.status) || terminal.includes(String(st.status))) {
          announce(r);
          return;
        }
      } catch {}
    } else if (terminal.includes(String(st.status))) {
      finish(tempId, st.text || "处理完了，但没有产出内容。");
      return;
    }
    setTimeout(tick, 1100);
  };
  setTimeout(tick, 700);
}

/* ---- one place decides what a finished task tells the user ----
   Both the submit poller and the background feed poller can reach a terminal
   state, so announcing from either call site produced duplicate popups. The
   `_announced` guard lives on the result object itself, which is the single
   record of "this outcome has already been reported". */
function announce(result) {
  if (!result || result._announced) return;
  result._announced = true;

  const ok = result.status === "succeeded";
  const files = (result.artifacts || []).length;
  const head = ok ? "做好了" : result.status === "cancelled" ? "已取消" : "没做成";
  const detail = ok
    ? (files ? result.conclusion + "（" + files + " 个文件）" : result.conclusion)
    : (result.error || result.conclusion || "");

  toast(head + (ok ? "" : "：" + detail.slice(0, 40)));
  if (ok && files) loadArtifactsShelf();
  Notify.show(
    head + " · " + String(result.ask || result.title || "").slice(0, 40),
    detail.slice(0, 160),
    result.task_id,
  );
}

function finish(tempId, reason) {
  const cur = S.items.get(tempId);
  if (!cur) return;
  const failed = { ...cur, status: "failed", state: { text: "没做成", tone: "error" }, error: reason };
  upsert(failed);
  // A give-up is still an outcome the user is waiting on: the page stopped
  // watching, so if they walked away they must still be told.
  announce(S.items.get(tempId));
}

// The caret can move without the value changing (arrow keys, click), and the
// menu follows the caret, so those need the same refresh.
$("input").addEventListener("click", renderSlash);
$("input").addEventListener("keyup", (e) => {
  if (["ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)) renderSlash();
});
$("input").addEventListener("blur", () => setTimeout(closeSlash, 120));
$("input").addEventListener("keydown", (e) => {
  const menuOpen = !$("slash-menu").hidden && S.slashItems.length > 0;
  if (menuOpen) {
    // The menu owns the arrow/enter/escape keys while it is open, otherwise
    // Enter would submit a half-typed "/rel" instead of picking the skill.
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      const delta = e.key === "ArrowDown" ? 1 : -1;
      S.slashIndex = (S.slashIndex + delta + S.slashItems.length) % S.slashItems.length;
      renderSlash();
      return;
    }
    if (e.key === "Enter" && !e.isComposing) {
      e.preventDefault();
      applySlash(S.slashItems[S.slashIndex].name);
      return;
    }
    if (e.key === "Escape") {
      e.preventDefault();
      closeSlash();
      return;
    }
  }
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    submit($("input").value);
  }
});
$("composer").addEventListener("submit", (e) => {
  e.preventDefault();
  submit($("input").value);
});

async function loadArtifactsShelf() {
  try {
    const data = await api("/api/artifacts?limit=120");
    S.shelfArtifacts = data.artifacts || [];
    renderShelf();
  } catch (e) {
    const g = $("shelf-grid");
    if (g) g.innerHTML = '<div class="empty" style="grid-column:1/-1;padding:28px">无法加载产出文件：' + esc(e.message) + '</div>';
  }
}

function renderShelf() {
  const g = $("shelf-grid");
  if (!g) return;
  const query = (S.shelfQuery || "").trim().toLowerCase();
  const filtered = S.shelfArtifacts.filter((a) => {
    if (!query) return true;
    return a.name.toLowerCase().includes(query) ||
           (a.task_title || "").toLowerCase().includes(query) ||
           a.path.toLowerCase().includes(query);
  });

  $("shelf-count").textContent = filtered.length + " 个文件";

  if (!filtered.length) {
    const msg = query ? "没有匹配当前筛选的文件" : "暂无任何产出文件";
    g.innerHTML = '<div class="empty" style="grid-column:1/-1;padding:28px">' + msg + '</div>';
    return;
  }

  g.innerHTML = filtered.map((a) => {
    const isHtml = /\.(html?|htm|svg)$/i.test(a.name);
    const ic = isHtml ? "🌐" : /\.(md|txt)$/i.test(a.name) ? "📝" : /\.(py|js|css|json)$/i.test(a.name) ? "⚙️" : "📄";
    return '<div class="shelf-tile" data-file="' + esc(a.path) + '">' +
      '<button class="tile-menu-btn" data-tile-menu="' + esc(a.path) + '" type="button" title="更多操作">⋯</button>' +
      '<div class="shelf-tile-top">' +
        '<span class="shelf-tile-ic">' + ic + '</span>' +
        '<span class="shelf-tile-name" title="' + esc(a.name) + '">' + esc(a.name) + '</span>' +
        '<span class="shelf-tile-size">' + bytes(a.size) + '</span>' +
      '</div>' +
      '<div class="shelf-tile-task" title="' + esc(a.task_title) + '">来自：' + esc(a.task_title) + '</div>' +
      '<div class="shelf-tile-time">' + esc(when(a.modified_at)) + '</div>' +
    '</div>';
  }).join("");

  g.querySelectorAll(".shelf-tile").forEach((tile) => {
    tile.onclick = (e) => {
      if (e.target.closest("[data-tile-menu]")) return;
      openFile(tile.dataset.file);
    };
  });

  g.querySelectorAll("[data-tile-menu]").forEach((btn) => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const key = btn.dataset.tileMenu;
      const already = openMenu && openMenu.dataset.for === key;
      closeMenu();
      if (already) return;
      const artifact = S.shelfArtifacts.find((x) => x.path === key);
      if (!artifact) return;
      const menu = buildFileMenu(artifact);
      menu.dataset.for = key;
      document.body.appendChild(menu);
      positionMenu(menu, btn);
      openMenu = menu;
    };
  });
}
