/* ---------- skills ---------- */
// Two ways to pick a skill, because they serve different moments:
//   /  in the composer  -> the list appears right under the cursor
//   the chips below     -> one click, no typing
// Both write to the same S.pickedSkills set, so they can never disagree.
function skillTip(s) {
  return s.description + (s.when_to_use ? "\n适用：" + s.when_to_use : "");
}

function renderPicked() {
  const row = $("picked-row");
  if (!row) return;
  if (!S.pickedSkills.size) { row.hidden = true; row.innerHTML = ""; return; }
  row.hidden = false;
  row.innerHTML = '<span class="lead">本次套用：</span>' +
    [...S.pickedSkills].map((name) => {
      const s = S.skills.find((x) => x.name === name);
      const label = s ? (s.title || s.name) : name;
      return '<span class="picked-tag">✦ ' + esc(label) +
        '<button type="button" data-unpick="' + esc(name) +
        '" title="移除这个技能" aria-label="移除">×</button></span>';
    }).join("");
  row.querySelectorAll("[data-unpick]").forEach((btn) => {
    btn.onclick = () => {
      S.pickedSkills.delete(btn.dataset.unpick);
      renderSkills();
      renderSkillPanel();
      renderSlash();
    };
  });
}

function renderSkills() {
  const bar = $("skills-bar");
  renderPicked();
  const badge = $("skill-count");
  if (badge) {
    badge.hidden = S.pickedSkills.size === 0;
    badge.textContent = S.pickedSkills.size;
  }
  const btn = $("skill-btn");
  if (btn) btn.classList.toggle("on", !$("skill-panel").hidden || S.pickedSkills.size > 0);
  if (!S.skills.length) { bar.hidden = true; return; }
  bar.hidden = false;
  bar.innerHTML = '<span class="lead">用技能：</span>' + S.skills.map((s) => {
    const on = S.pickedSkills.has(s.name);
    return '<button type="button" class="skill-chip' + (on ? " on" : "") + '"' +
      ' data-skill="' + esc(s.name) + '" title="' + esc(skillTip(s)) +
      '" aria-pressed="' + on + '">' +
      '<span class="tick">✓</span>' + esc(s.title || s.name) + "</button>";
  }).join("") +
    (S.pickedSkills.size
      ? '<button type="button" class="skill-chip" data-skill-clear="1" title="取消全部技能">✕ 清除</button>'
      : "");
  bar.querySelectorAll("[data-skill]").forEach((btn) => {
    btn.onclick = () => toggleSkill(btn.dataset.skill);
  });
  const clear = bar.querySelector("[data-skill-clear]");
  if (clear) clear.onclick = () => { S.pickedSkills.clear(); renderSkills(); };
}

function toggleSkill(name) {
  if (S.pickedSkills.has(name)) S.pickedSkills.delete(name);
  else S.pickedSkills.add(name);
  renderSkills();
  // All three pickers (panel rows, chips, "/") show the same selection state,
  // so every change has to repaint them together.
  renderSkillPanel();
  renderSlash();
}

/* ---------- slash menu ---------- */
function slashQuery() {
  const el = $("input");
  // Only the token the caret sits in counts: a slash mid-sentence is prose,
  // not a command. Requiring the token to start the value keeps it predictable.
  const before = el.value.slice(0, el.selectionStart);
  const m = before.match(/(?:^|\s)\/([^\s\/]*)$/);
  return m ? m[1] : null;
}

function slashMatches(query) {
  const q = (query || "").toLowerCase();
  return S.skills.filter((s) => {
    if (!q) return true;
    const hay = (s.name + " " + (s.title || "") + " " + s.description + " " +
      (s.tags || []).join(" ")).toLowerCase();
    return hay.includes(q);
  });
}

function renderSlash() {
  const menu = $("slash-menu");
  const query = slashQuery();
  if (query === null) { closeSlash(); return; }
  if (!$("skill-panel").hidden) closeSkillPanel();
  if (!S.skills.length) {
    menu.hidden = false;
    menu.innerHTML = '<div class="slash-empty">还没有安装技能。在项目里建一个 ' +
      '<code>skills/名字/SKILL.md</code> 就会出现。</div>';
    return;
  }
  // Ask Magpie for catalogue matches alongside the local list.
  scheduleMarketSearch(query);
  const items = slashMatches(query);
  S.slashItems = items;
  if (S.slashIndex >= items.length) S.slashIndex = 0;
  menu.hidden = false;
  if (!items.length) {
    // No local match does not mean no skill exists: the Magpie catalogue may
    // still have it, so show that section instead of a dead-end message.
    const marketOnly = marketSectionHtml(query);
    menu.innerHTML = marketOnly
      ? '<div class="slash-empty">本地没有「' + esc(query) + '」</div>' + marketOnly +
        '<div class="slash-foot">↑↓ 选择 · Enter 确认 · Esc 关闭</div>'
      : '<div class="slash-empty">没有匹配「' + esc(query) + '」的技能</div>';
    bindMarketRows(menu);
    return;
  }
  menu.innerHTML = items.map((s, i) => {
    const on = S.pickedSkills.has(s.name);
    return '<button type="button" class="slash-item' +
      (i === S.slashIndex ? " sel" : "") + '" role="option"' +
      ' aria-selected="' + (i === S.slashIndex) + '" data-slash="' + esc(s.name) + '">' +
      '<span class="nm">/' + esc(s.name) + "</span>" +
      '<span class="ds">' + esc(s.description) + "</span>" +
      (on ? '<span class="on">已选</span>' : "") + "</button>";
  }).join("") +
    marketSectionHtml(query) +
    '<div class="slash-foot">↑↓ 选择 · Enter 确认 · Esc 关闭</div>';
  menu.querySelectorAll("[data-slash]").forEach((btn) => {
    btn.onmousedown = (e) => {
      // mousedown, not click: the textarea blurs first and would close the menu.
      e.preventDefault();
      applySlash(btn.dataset.slash);
    };
  });
  bindMarketRows(menu);
}

/* --- Magpie skill market: browse and install from the composer --- */
function fmtCount(n) {
  if (n >= 1000000) return (n / 1000000).toFixed(1) + "M";
  if (n >= 1000) return Math.round(n / 1000) + "k";
  return String(n);
}

function marketSectionHtml(query) {
  if (S.marketLoading) {
    return '<div class="slash-sec"><span class="n">Magpie 技能市场</span></div>' +
      '<div class="slash-busy">正在搜索…</div>';
  }
  if (!S.marketRows.length) return "";
  const rows = S.marketRows.slice(0, 6).map((m) => {
    const have = S.skills.some((s) => s.name === m.skill_id);
    return '<button type="button" class="slash-item market-item"' +
      ' data-market="' + esc(m.ref) + '" title="' + esc(m.description || m.ref) + '">' +
      '<span class="nm">' + esc(m.skill_id) + '</span>' +
      '<span class="ds">' + esc(m.source) + '</span>' +
      '<span class="inst">' + (m.installs ? fmtCount(m.installs) : "") + '</span>' +
      '<span class="add">' + (have ? "已装" : "+ 装") + '</span></button>';
  }).join("");
  return '<div class="slash-sec"><span class="n">Magpie 技能市场</span></div>' + rows;
}

function bindMarketRows(menu) {
  menu.querySelectorAll("[data-market]").forEach((btn) => {
    btn.onmousedown = (e) => {
      e.preventDefault();
      installFromMarket(btn.dataset.market, btn);
    };
  });
}

function scheduleMarketSearch(query) {
  clearTimeout(S.marketTimer);
  const q = (query || "").trim();
  if (q.length < 2) { S.marketRows = []; S.marketLoading = false; return; }
  S.marketTimer = setTimeout(() => runMarketSearch(q), 260);
}

async function runMarketSearch(query) {
  S.marketLoading = true;
  if (!$("slash-menu").hidden) renderSlash();
  try {
    const d = await api("/api/skills/market?limit=6&q=" + encodeURIComponent(query));
    S.marketRows = d.skills || [];
    S.marketQuery = query;
  } catch {
    // Magpie may not be installed; the local list still works on its own.
    S.marketRows = [];
  } finally {
    S.marketLoading = false;
    if (!$("slash-menu").hidden) renderSlash();
  }
}

async function installFromMarket(ref, btn) {
  if (btn) btn.classList.add("installing");
  toast("正在从 Magpie 安装 " + ref + " …");
  try {
    const d = await api("/api/skills/install", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ source: ref, from_magpie: true }),
    });
    await loadSkills();
    const names = (d.installed || []);
    if (names.length) {
      toast("装好了：" + names.join("、"));
      names.forEach((n) => S.pickedSkills.add(n));
      // Show the thing that was just installed: leaving the user on a market
      // list with no sign of the new skill reads as "nothing happened".
      S.spTab = "installed";
      S.spError = null;
      renderSkills();
      renderSlash();
      renderSkillPanel();
    } else {
      toast("没有新增技能（已装过，或解析失败）");
      if (btn) btn.classList.remove("installing");
    }
  } catch (e) {
    // A catalogue entry can point at a folder that no longer exists (Magpie's
    // index drifts). The message names the skills the repo DOES have, which is
    // far too long for a toast that disappears in three seconds.
    S.spError = ref + "：" + e.message;
    S.spErrorTab = S.spTab;
    if (btn) btn.classList.remove("installing");
    renderSkillPanel();
  }
}

function closeSlash() {
  const menu = $("slash-menu");
  if (menu) menu.hidden = true;
  S.slashItems = [];
  S.slashIndex = 0;
}

function applySlash(name) {
  const el = $("input");
  // Strip the /token that opened the menu, keep everything else the user typed.
  const before = el.value.slice(0, el.selectionStart);
  const after = el.value.slice(el.selectionStart);
  const stripped = before.replace(/(^|\s)\/([^\s\/]*)$/, "$1");
  el.value = (stripped + after).replace(/^\s+/, "");
  el.selectionStart = el.selectionEnd = el.value.length;
  toggleSkill(name);
  closeSlash();
  autoGrow();
  el.focus();
}

/* ---------- 技能面板：可发现的管理入口 ---------- */
// 输入框打 "/" 是给知道这个功能的人的快捷方式；这个面板才是入口：
// 按钮在输入框里，打开就能看到装了什么、市场有什么、能装也能删。
function openSkillPanel(tab) {
  if (tab) S.spTab = tab;
  $("skill-panel").hidden = false;
  renderSkillPanel();
  // Fetch the agent list even when that tab is not open: the count on the tab
  // is what tells the user there is something worth importing.
  if (!S.agentSources.length && !S.agentLoading) loadAgentSkills(true);
  if (S.spTab === "market" && !S.marketRows.length) runPanelMarketSearch("");
  const q = $("sp-q");
  if (q && window.innerWidth > 560) q.focus();
}

function closeSkillPanel() {
  $("skill-panel").hidden = true;
  renderSkills();
}

function toggleSkillPanel() {
  if ($("skill-panel").hidden) openSkillPanel();
  else closeSkillPanel();
}

function marketRowHtml(m) {
  const have = S.skills.some((s) => s.name === m.skill_id);
  return '<div class="sp-row">' +
    '<div class="main">' +
      '<div class="nm">' + esc(m.skill_id) +
        (m.official ? '<span class="sp-official">官方</span>' : "") + '</div>' +
      '<div class="ds">' + esc(m.description || "（无简介）") + '</div>' +

      ? '<button type="button" class="sp-act picked" disabled>已安装</button>'

function agentPillsHtml() {
  const total = S.agentSkills.length;
  let html = '<button type="button" class="sp-pill' + (S.agentFilter === "all" ? " on" : "") +
    '" data-agent-filter="all">全部 <span class="n">' + total + '</span></button>';
  // The API only returns agents that exist on this machine, so every pill here
  // is a real place with real skills.
  S.agentSources.forEach((src) => {
    html += '<button type="button" class="sp-pill' +
      (S.agentFilter === src.id ? " on" : "") + '"' +
      ' data-agent-filter="' + esc(src.id) + '" title="' + esc(src.path) + '">' +
      esc(src.label) + ' <span class="n">' + src.count + '</span></button>';

function renderSkillPanel() {
  const body = $("sp-body");
  const foot = $("sp-foot");
  const sub = $("sp-sub");
  const raw = $("sp-q").value || "";
  const q = raw.trim().toLowerCase();
  const installedN = $("sp-installed-n");
  if (installedN) installedN.textContent = S.skills.length;
  const agentsN = $("sp-agents-n");
  if (agentsN) agentsN.textContent = S.agentSkills.length;

  document.querySelectorAll(".sp-tab").forEach((tab) => {
    tab.classList.toggle("on", tab.dataset.spTab === S.spTab);
  });

  const error = S.spError
    ? '<div class="sp-error"><div class="msg">' + esc(S.spError) + '</div>' +
      '<button type="button" class="sp-act" id="sp-error-close">知道了</button></div>'
    : "";

  // The agent sub-filter only belongs on its own tab.
  if (S.spTab === "agents") {
    if (!S.agentSources.length && !S.agentLoading) loadAgentSkills();
    sub.hidden = false;
    sub.innerHTML = agentPillsHtml();
  } else {
    sub.hidden = true;
    sub.innerHTML = "";
  }

  if (S.spTab === "installed") {
    const rows = S.skills.filter((s) => {
      if (!q) return true;
      const hay = (s.name + " " + (s.title || "") + " " + (s.description || "") + " " +
        (s.tags || []).join(" ")).toLowerCase();
      return hay.includes(q);
    });
    if (!rows.length) {
      body.innerHTML = error + '<div class="sp-empty">' +
        (q ? '没有匹配「' + esc(raw) + '」的技能'
           : '还没有技能。<br>去「其他 agent」导入现成的，或把文件夹/压缩包拖到下面。') +
        '</div>';
    } else {
      body.innerHTML = error + rows.map(skillRowHtml).join("");
    }
    foot.innerHTML = '<span>选中的技能会随这条消息一起发送</span>' +
      '<span class="spacer"></span>' +
      (S.pickedSkills.size ? '<button type="button" class="sp-act" id="sp-clear">清空已选</button>' : "") +
      '<span>也可在输入框打 <code>/</code></span>';
  } else if (S.spTab === "agents") {
    if (S.agentLoading) {
      body.innerHTML = error + '<div class="sp-empty">正在扫描本机其他 agent 的技能…</div>';
    } else {
      const rows = S.agentSkills.filter((item) => {
        if (S.agentFilter !== "all" && !(item.agents || []).some((a) => a[0] === S.agentFilter)) return false;
        if (!q) return true;
        const hay = (item.name + " " + (item.title || "") + " " + (item.description || "")).toLowerCase();
        return hay.includes(q);
      });
      const broken = S.agentSources
        .filter((s) => (s.skipped || []).length)
        .flatMap((s) => (s.skipped || []).map((item) => s.label + "：" + item[0] + " — " + item[1]));
      const brokenNote = broken.length
        ? '<div class="sp-error"><div class="msg">' +
            '<strong>' + broken.length + ' 个技能无法读取</strong><br>' +
            broken.map(esc).join("<br>") +
          '</div></div>'
        : "";
      if (!S.agentSources.some((s) => s.count)) {
        body.innerHTML = error + brokenNote + '<div class="sp-empty">本机没有找到其他 agent 的技能目录。<br>' +
          '<span style="font-size:11.5px">会扫描 ~/.claude/skills、~/.codex/skills、~/.gemini/skills、~/.agents/skills 等</span></div>';
      } else if (!rows.length) {
        body.innerHTML = error + brokenNote + '<div class="sp-empty">' +
          (q ? '没有匹配「' + esc(raw) + '」的技能' : "这个 agent 目录里没有技能") + '</div>';
      } else {
        body.innerHTML = error + brokenNote + rows.map(agentRowHtml).join("");
      }
    }
    foot.innerHTML = '<span>导入是复制一份，不改动原来的 agent 目录</span>' +
      '<span class="spacer"></span>' +
      '<button type="button" class="sp-act" id="sp-import-all">全部导入</button>';
  } else {
    if (S.marketLoading) {
      body.innerHTML = error + '<div class="sp-empty">正在搜索 Skill 市场…</div>';
    } else if (!S.marketRows.length) {
      body.innerHTML = error + '<div class="sp-empty">' +
        (q ? '市场里没有匹配「' + esc(raw) + '」的技能'
           : '输入关键词搜 Skill 市场<br><span style="font-size:11.5px">' +
             (S.marketTotal ? S.marketTotal + ' 个技能可安装' : '需要本机已安装 Magpie') +
             '</span>') +
        '</div>';
    } else {
      body.innerHTML = error + S.marketRows.map(marketRowHtml).join("");
    }
    foot.innerHTML = '<span>' + (S.marketTotal ? "市场共 " + S.marketTotal + " 个技能" : "") +
      '</span><span class="spacer"></span>' +
      '<span>来自 GitHub 仓库，安装即复制到 <code>skills/</code></span>';
  }

  bindSkillPanelRows();
}

function bindSkillPanelRows() {
  const body = $("sp-body");
  body.querySelectorAll("[data-sp-pick]").forEach((btn) => {
    btn.onclick = () => toggleSkill(btn.dataset.spPick);
  });
  body.querySelectorAll("[data-sp-remove]").forEach((btn) => {
    btn.onclick = () => removeSkill(btn.dataset.spRemove, btn);
  });
  body.querySelectorAll("[data-sp-install]").forEach((btn) => {
    btn.onclick = () => {
      btn.disabled = true;
      btn.textContent = "安装中…";
      installFromMarket(btn.dataset.spInstall, btn).then(() => renderSkillPanel());
    };
  });
  body.querySelectorAll("[data-sp-import]").forEach((btn) => {
    btn.onclick = () => importFromAgent(btn.dataset.spImport, [btn.dataset.spName], btn);
  });

  document.querySelectorAll("[data-agent-filter]").forEach((pill) => {
    pill.onclick = () => {
      S.agentFilter = pill.dataset.agentFilter;
      renderSkillPanel();
    };
  });

  const importAll = document.getElementById("sp-import-all");
  if (importAll) {
    importAll.onclick = () => {
      const missing = S.agentSkills.filter(
        (item) => !S.skills.some((s) => s.name === item.name)
          && (S.agentFilter === "all" || (item.agents || []).some((a) => a[0] === S.agentFilter))
      );
      if (!missing.length) { toast("没有需要导入的技能"); return; }
      const byAgent = {};
      missing.forEach((item) => {
        (byAgent[item.agent] = byAgent[item.agent] || []).push(item.name);
      });
      Promise.all(Object.entries(byAgent).map(([agent, names]) => importFromAgent(agent, names)))
        .then(() => renderSkillPanel());
    };
  }

  const errBtn = document.getElementById("sp-error-close");
  if (errBtn) errBtn.onclick = () => { S.spError = null; renderSkillPanel(); };
  const clear = document.getElementById("sp-clear");
  if (clear) {
    clear.onclick = () => {
      S.pickedSkills.clear();
      renderSkills();
      renderSkillPanel();
      renderSlash();
    };
  }
}

async function loadAgentSkills(force) {
  // A prefetch may still be in flight; wait for it instead of returning early,
  // or the tab that asked would render empty forever.
  if (S._agentWait) {
    await S._agentWait;
    return;
  }
  if (!force && S.agentSources.length) return;
  S.agentLoading = true;
  S._agentWait = new Promise((done) => { S._agentDone = done; });
  try {
    const d = await api("/api/skills/agents");
    S.agentSources = d.sources || [];
    S.agentSkills = d.skills || [];
  } catch (e) {
    S.agentSources = [];
    S.agentSkills = [];
    S.spError = "读取其他 agent 的技能失败：" + e.message;
  } finally {
    S.agentLoading = false;
    S._agentWait = null;
    if (S._agentDone) { S._agentDone(); S._agentDone = null; }
    if (!$("skill-panel").hidden) renderSkillPanel();
  }
}

async function importFromAgent(agentId, names, btn) {
  if (btn) { btn.disabled = true; btn.textContent = "导入中…"; }
  try {
    const d = await api("/api/skills/import", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ source: agentId, from_agent: true, names: names || [] }),
    });
    await loadSkills();
    await loadAgentSkills(true);
    const got = d.imported || [];
    if (got.length) {
      toast("导入了 " + got.length + " 个技能：" + got.slice(0, 3).join("、") + (got.length > 3 ? "…" : ""));
      got.forEach((n) => S.pickedSkills.add(n));
      renderSkills();
    }
    if (d.skipped && d.skipped.length) {
      S.spError = d.skipped.map((x) => x[0] + "：" + x[1]).join("；");
    }
  } catch (e) {
    S.spError = "导入失败：" + e.message;
  }
  renderSkillPanel();
}

async function removeSkill(name, btn) {
  const ok = confirm("从磁盘删除技能「" + name + "」？\n" +
    "（只有用安装命令装的技能能这样移除，手写的会保留）");
  if (!ok) return;
  if (btn) { btn.disabled = true; btn.textContent = "移除中…"; }
  try {
    await api("/api/skills/" + encodeURIComponent(name), { method: "DELETE" });
    S.pickedSkills.delete(name);
    await loadSkills();
    toast("已移除 " + name);
  } catch (e) {
    toast("移除失败：" + e.message);
  }
  renderSkillPanel();
}

function schedulePanelMarketSearch() {
  const q = ($("sp-q").value || "").trim();
  clearTimeout(S.spTimer);
  S.spTimer = setTimeout(() => runPanelMarketSearch(q), 280);
}

async function runPanelMarketSearch(q) {
  S.marketLoading = true;
  renderSkillPanel();
  try {
    const d = await api("/api/skills/market?limit=40&q=" + encodeURIComponent(q));
    S.marketRows = d.skills || [];
    S.marketTotal = d.total || 0;
  } catch {
    S.marketRows = [];
    S.marketTotal = 0;
  } finally {
    S.marketLoading = false;
    if (!$("skill-panel").hidden) renderSkillPanel();
  }
}
/* ---------- 拖放 / 选择文件 / 手动加链接 ---------- */
// 支持拖文件夹和压缩包。文件夹在浏览器里没有路径，所以读取里面的所有文件，
// 在前端重新组装成一个 zip（只保留含 SKILL.md 的那一层目录），再交给后端解析。
// 这样后端只需要处理一种输入，前端也不要求用户先自己压缩。

function isArchiveName(name) {
  const n = (name || "").toLowerCase();
  return [".zip", ".tar", ".tar.gz", ".tgz", ".tar.bz2", ".tar.xz"]
    .some((suffix) => n.endsWith(suffix));
}

function bytesOf(n) {
  if (n >= 1048576) return (n / 1048576).toFixed(1) + " MB";
  return Math.max(1, Math.round(n / 1024)) + " KB";
}

function setDropActive(on) {
  const overlay = $("page-drop");
  if (overlay) overlay.classList.toggle("on", on);
  const zone = $("sp-drop");
  if (zone) zone.classList.toggle("active", on);
}

async function handleDropped(dt) {
  const items = dt.items ? [...dt.items] : [];
  const files = dt.files ? [...dt.files] : [];
  let folders = 0;
  const archiveFiles = [];
  for (const file of files) {
    if (isArchiveName(file.name)) archiveFiles.push(file);
  }
  // webkitGetAsEntry 才能拿到目录结构；旧浏览器退回 files。
  const entries = [];
  for (const item of items) {
    const entry = item.webkitGetAsEntry && item.webkitGetAsEntry();
    if (!entry) continue;
    if (entry.isDirectory) { entries.push(entry); folders += 1; }
  }

  if (!folders && !archiveFiles.length) {
    toast("没有识别到文件夹或压缩包");
    return;
  }

  for (const entry of entries) {
    await importFolderEntry(entry);
  }
  for (const file of archiveFiles) {
    await uploadArchive(file);
  }
  await loadSkills();
  renderSkillPanel();
}

function readAllEntries(dirEntry) {
  return new Promise((resolve, reject) => {
    const reader = dirEntry.createReader();
    const all = [];
    const step = () => {
      reader.readEntries((batch) => {
        if (!batch.length) { resolve(all); return; }
        all.push(...batch);
        step();
      }, reject);
    };
    step();
  });
}

async function walkEntry(entry, prefix, out) {
  if (entry.isFile) {
    const file = await new Promise((res, rej) => entry.file(res, rej));
    if (file.name.startsWith(".")) return;
    out.push({ path: prefix + file.name, file });
    return;
  }
  if (!entry.isDirectory) return;
  if (entry.name === "__MACOSX" || entry.name === "node_modules" ||
      entry.name === ".git" || entry.name === "__pycache__") return;
  const children = await readAllEntries(entry);
  for (const child of children) {
    await walkEntry(child, prefix + entry.name + "/", out);
  }
}

async function importFolderEntry(entry) {
  toast("正在读取文件夹 " + entry.name + " …");
  const out = [];
  try {
    await walkEntry(entry, "", out);
  } catch (e) {
    S.spError = "读取文件夹失败：" + e.message;
    renderSkillPanel();
    return;
  }
  const skillFiles = out.filter((f) => f.path.endsWith("SKILL.md"));
  if (!skillFiles.length) {
    S.spError = "「" + entry.name + "」里没有找到 SKILL.md，无法识别为技能。";
    toast("没有找到 SKILL.md");
    renderSkillPanel();
    return;
  }
  const total = out.reduce((sum, f) => sum + f.file.size, 0);
  if (total > 60 * 1024 * 1024) {
    S.spError = "文件夹太大（" + bytesOf(total) + "），超过 60 MB 上限。";
    renderSkillPanel();
    return;
  }
  // 只保留含 SKILL.md 的目录层级，其余（文档、截图、node_modules）不带。
  const roots = skillFiles.map((f) => f.path.slice(0, f.path.length - "SKILL.md".length));
  const keep = out.filter((f) => roots.some((r) => f.path.startsWith(r)));
  await sendFolder(keep, entry.name);
}

// 文件夹打包交给后端：前端只把文件读成 base64 发过去，服务端重建目录树。
// 这样不依赖任何打包库（断网也能用），也不用为一种输入写两条解析路径。
const TEXT_EXT = [
  ".md", ".txt", ".json", ".yaml", ".yml", ".toml", ".ini", ".cfg", ".csv",
  ".py", ".js", ".ts", ".sh", ".ps1", ".bat", ".html", ".css", ".xml", ".svg",
];

function readAsBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const result = String(reader.result || "");
      const comma = result.indexOf(",");
      resolve(comma >= 0 ? result.slice(comma + 1) : "");
    };
    reader.onerror = () => reject(reader.error || new Error("读取失败"));
    reader.readAsDataURL(file);
  });
}

async function sendFolder(entries, label) {
  if (S.importing) return;
  if (!entries.length) {
    S.spError = "「" + label + "」里没有可导入的文件。";
    renderSkillPanel();
    return;
  }
  // 只发文本类文件：技能是说明文档，二进制资源既没必要也容易超限。
  const usable = entries.filter((f) => {
    const n = f.path.toLowerCase();
    return TEXT_EXT.some((ext) => n.endsWith(ext)) || n.endsWith("skill.md");
  });
  if (!usable.some((f) => f.path.toLowerCase().endsWith("skill.md"))) {
    S.spError = "「" + label + "」里没有 SKILL.md，无法识别为技能。";
    toast("没有找到 SKILL.md");
    renderSkillPanel();
    return;
  }
  const skippedBinary = entries.length - usable.length;
  S.importing = true;
  toast("正在导入文件夹 " + label + " …");
  try {
    const payload = [];
    let bytes = 0;
    for (const f of usable) {
      if (f.file.size > 8 * 1024 * 1024) continue;
      bytes += f.file.size;
      if (bytes > 60 * 1024 * 1024) {
        throw new Error("文件夹超过 60 MB 上限");
      }
      payload.push({ path: f.path, content: await readAsBase64(f.file) });
    }
    const d = await api("/api/skills/upload-files", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ files: payload }),
    });
    const got = d.imported || [];
    if (got.length) {
      toast("导入了 " + got.length + " 个技能：" + got.slice(0, 3).join("、") +
        (got.length > 3 ? "…" : ""));
      got.forEach((n) => S.pickedSkills.add(n));
      S.spError = null;
      S.spTab = "installed";
    } else {
      S.spError = "「" + label + "」没有导入任何技能" +
        (d.skipped && d.skipped.length ? "（" + d.skipped.length + " 个被跳过）" : "");
    }
    if (d.skipped && d.skipped.length) {
      S.spError = d.skipped.map((x) => x[0] + "：" + x[1]).join("；");
    } else if (skippedBinary > 0 && got.length) {
      toast("已跳过 " + skippedBinary + " 个非文本文件");
    }
    await loadSkills();
  } catch (e) {
    S.spError = "导入文件夹失败：" + e.message;
    toast("导入失败：" + e.message);
  } finally {
    S.importing = false;
    renderSkillPanel();
  }
}
async function uploadArchive(file) {
  if (file.size > 60 * 1024 * 1024) {
    S.spError = "「" + file.name + "」有 " + bytesOf(file.size) + "，超过 60 MB 上限。";
    renderSkillPanel();
    return;
  }
  toast("正在导入 " + file.name + " …");
  await sendArchive(file, file.name);
}

async function sendArchive(blob, filename) {
  if (S.importing) return;
  S.importing = true;
  try {
    const res = await fetch("/api/skills/upload?filename=" + encodeURIComponent(filename), {
      method: "POST",
      headers: { "Content-Type": "application/octet-stream" },
      body: blob,
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || ("HTTP " + res.status));
    const got = data.imported || [];
    if (got.length) {
      toast("导入了 " + got.length + " 个技能：" + got.slice(0, 3).join("、") + (got.length > 3 ? "…" : ""));
      got.forEach((n) => S.pickedSkills.add(n));
      S.spError = null;
    } else {
      S.spError = "「" + filename + "」里没有导入任何技能" +
        (data.skipped && data.skipped.length ? "（" + data.skipped.length + " 个被跳过）" : "");
    }
    if (data.skipped && data.skipped.length) {
      S.spError = data.skipped.map((x) => x[0] + "：" + x[1]).join("；");
    }
    S.spTab = "installed";
    await loadSkills();
  } catch (e) {
    S.spError = "导入失败：" + e.message;
    toast("导入失败：" + e.message);
  } finally {
    S.importing = false;
    renderSkillPanel();
  }
}

async function addByLink() {
  const value = prompt("输入技能目录路径、git 链接，或 owner/repo：\n\n" +
    "例：C:\\skills\\my-skill\n例：someone/skills/my-skill");
  if (!value || !value.trim()) return;
  const text = value.trim();
  S.spError = null;
  toast("正在安装 " + text + " …");
  try {
    // 有斜杠且像 owner/repo 或 URL 时按市场/仓库装，否则按本地目录导入。
    const looksRemote = /^(https?:|git@|ssh:)/.test(text) ||
      (/^[\w.-]+\/[\w.-]+/.test(text) && !/^[A-Za-z]:[\\/]/.test(text) && !text.startsWith("/"));
    let d;
    if (looksRemote) {
      const parts = text.split("/");
      const isMarketRef = parts.length >= 3 && !/^https?:|^git@/.test(text);
      d = await api("/api/skills/install", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          source: text,
          from_magpie: isMarketRef,
        }),
      });
    } else {
      d = await api("/api/skills/import", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ source: text }),
      });
    }
    const got = d.installed || d.imported || [];
    if (got.length) {
      toast("装好了：" + got.join("、"));
      got.forEach((n) => S.pickedSkills.add(n));
      S.spTab = "installed";
    } else {
      S.spError = "没有新增技能" + (d.skipped && d.skipped.length
        ? "：" + d.skipped.map((x) => x[0] + "：" + x[1]).join("；") : "");
    }
    await loadSkills();
  } catch (e) {
    S.spError = "安装失败：" + e.message;
  }
  renderSkillPanel();
}

function bindSkillPanelTools() {
  const linkBtn = $("sp-add-link");
  if (linkBtn) linkBtn.onclick = addByLink;

  const fileBtn = $("sp-add-file");
  const fileInput = $("sp-file");
  const dirInput = $("sp-dir");
  if (fileBtn && fileInput) {
    fileBtn.onclick = (e) => {
      // Shift 点击选文件夹；普通点击选压缩包。
      if (e.shiftKey && dirInput) dirInput.click();
      else fileInput.click();
    };
  }
  if (fileInput) {
    fileInput.onchange = async () => {
      const files = [...fileInput.files];
      fileInput.value = "";
      for (const f of files) await uploadArchive(f);
      await loadSkills();
      renderSkillPanel();
    };
  }
  if (dirInput) {
    dirInput.onchange = async () => {
      const files = [...dirInput.files];
      dirInput.value = "";
      if (!files.length) return;
      const out = files.map((f) => ({
        path: (f.webkitRelativePath || f.name).replace(/^[^/]+\//, ""),
        file: f,
      }));
      const hasSkill = out.some((f) => f.path.endsWith("SKILL.md"));
      if (!hasSkill) {
        S.spError = "选中的文件夹里没有 SKILL.md，无法识别为技能。";
        renderSkillPanel();
        return;
      }
      await sendFolder(out, files[0].webkitRelativePath.split("/")[0] || "folder");
    };
  }

  // 拖放：面板里的区域 + 整页。整页更符合资源管理器的直觉。
  const panel = $("skill-panel");
  ["dragenter", "dragover"].forEach((evt) => {
    document.addEventListener(evt, (e) => {
      if (!e.dataTransfer || ![...e.dataTransfer.types].includes("Files")) return;
      e.preventDefault();
      setDropActive(true);
    });
  });
  document.addEventListener("dragleave", (e) => {
    if (e.relatedTarget) return;
    setDropActive(false);
  });
  document.addEventListener("drop", async (e) => {
    if (!e.dataTransfer) return;
    e.preventDefault();
    setDropActive(false);
    if (panel.hidden) openSkillPanel("installed");
    await handleDropped(e.dataTransfer);
  });
}

async function loadSkills() {
  try {
    const d = await api("/api/skills");
    S.skills = d.skills || [];
    // A skill that vanished from disk must not stay selected invisibly.
    const live = new Set(S.skills.map((s) => s.name));
    for (const name of [...S.pickedSkills]) if (!live.has(name)) S.pickedSkills.delete(name);
    renderSkills();
    renderSlash();
    if (!$("skill-panel").hidden) renderSkillPanel();
  } catch {
    S.skills = [];
    renderSkills();
  }
}

$("hints").innerHTML = EXAMPLES.map((x) => '<button type="button">' + esc(x) + "</button>").join("");
$("hints").querySelectorAll("button").forEach((b) => {
  b.onclick = () => { $("input").value = b.textContent; autoGrow(); $("input").focus(); };
});

(async () => {
  try {
    const d = await api("/api/models");
    const list = d.models || [];
    $("model").innerHTML = list.map((m) =>
      '<option value="' + esc(m.id) + '">' + esc(m.display_name || m.id) + "</option>").join("");
    if (d.active) $("model").value = d.active;
  } catch {
    $("model").innerHTML = '<option value="">默认模型</option>';
  }
  paintNotifyButton();
  loadSkills();
  await loadFeed();
  loadArtifactsShelf();
  $("input").focus();
})();

// While hidden, poll faster so a notification arrives promptly; when visible,
// the feed refresh is only needed to pick up progress.
setInterval(() => {
  const live = [...S.items.values()].some((r) =>
    ["pending", "running", "waiting", "cancel_requested"].includes(r.status));
  if (live || document.visibilityState !== "visible") loadFeed();
}, 4000);

document.addEventListener("visibilitychange", () => {
  paintNotifyButton();
  if (document.visibilityState === "visible") loadFeed();
});
</script>
